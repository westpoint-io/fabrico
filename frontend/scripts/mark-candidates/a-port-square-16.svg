<!--
  a-port-square-16.svg - Candidate A for Phase 79, "The route is chosen". The 16px cut.

  ROUTE. Route 13, "The Port Square", from the logo route research, section 4.14.
  Same subject as a-port-square-full.svg: a machine seen from above with an item entering a
  port. This is a DIFFERENT DRAWING of that subject, not a smaller one.

  HAND-AUTHORED, NEVER SCALED (decision D-08). Scaling a 96px drawing down to 16px is
  precisely the failure this phase exists to expose, so a sheet built from scaled art would
  be a comparison that cannot fail. This cut differs from the full cut in shape count and in
  topology, not in size: it drops the core, and it closes three of the four notches so the
  ring becomes one continuous C. The four-way symmetry that is Route 13's pitch is a 96px
  property. At 16px it costs three shapes out of a budget of three and buys nothing a reader
  can resolve.

  WHAT THE NUMBERS BUY AT 16px, where one device pixel is two units: the 6u wall is 3 device
  pixels, the 16u hole is 8 device pixels, and the 2u gaps above and below the item are one
  device pixel each.

  NOT A SHIPPED ASSET. This file is a throwaway comparison candidate. Nothing in the
  application imports it, and nothing renders it outside the Phase 79 comparison sheet.

  WHY IT IS NOT IN frontend/src/chrome/assets/ (decision D-09). The discovery walk in
  scripts/lint-svg.ts and in render/assets/vertexBudget.test.ts is flat and non-recursive, so
  a file dropped into that directory silently joins the shipped asset set and moves three
  hand-edited count literals. A file dropped into a subdirectory of it is worse: an asset
  that looks shipped and that no gate measures at all. Phase 79 leaves that directory
  byte-identical to where it started.

  THE TWO LAYERS, IN PAINT ORDER (later paints on top):

    1. ring   fill  fab-ink           one continuous C, two subpaths: contour then hole
    2. item   fill  fab-accent-item   a 6u square entering the one remaining port

  Those paint tokens are named without their leading dashes on purpose. Two consecutive
  hyphens are illegal inside an XML comment, and that single character pair is what makes the
  shipped chrome/assets/logomark.svg unopenable by every strict parser in this tree. The fill
  attributes below sit outside the comment and keep their normal var(...) form.

  THE HOLE IS WOUND, NOT DECLARED. The chrome-asset dialect refuses fill-rule, so the inner
  hole is a second subpath wound in the opposite direction to its container and the default
  nonzero rule cuts it. The outer contour runs clockwise from the top left; the hole runs
  counter-clockwise from the same corner of the inner square. That is verified by rendering
  the file and looking at the result, never by reading the path data, because path data that
  looks wound and is not renders as a solid square and reads as a passing candidate.

  THE ITEM TOUCHES THE LEFT EDGE OF THE BOX ON PURPOSE, exactly as in the full cut: the half
  in, half out read is the route, and it costs the one pixel of padding convention on one
  edge.

  MONOCHROME RISK, RECORDED AND NOT DESIGNED AWAY. With the accent removed, the item and the
  ring are the same ink separated by one device pixel at 16px. That is the tightest
  monochrome adjacency on the sheet and it may be why this candidate loses. It is shown, not
  repaired.

  ART-04 PROVENANCE: authored from scratch for Phase 79. No icon pack was consulted, copied,
  traced or redrawn. Not game-icons.net, whose CC-BY-3.0 licence redrawing does not clear.
  Not Remix Icon, whose licence forbids logo use by name. No AI-generated image was used at
  any point.

  Geometry: integer coordinates only, commands limited to M H V L Z, zero curves, one path
  per semantic layer carrying its own stable data-part, one element per line.
-->
<svg viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg">
  <path data-part="ring" d="M 2 2 H 30 V 30 H 2 V 21 H 8 V 11 H 2 Z M 8 8 V 24 H 24 V 8 Z" fill="var(--fab-ink)" />
  <path data-part="item" d="M 0 13 H 6 V 19 H 0 Z" fill="var(--fab-accent-item)" />
</svg>
