<!--
  b-the-turn-16.svg - Candidate B for Phase 79, "The route is chosen". The 16px cut.

  ROUTE. Route 2, "The Turn", from the logo route research, section 4.3. Same
  subject as b-the-turn-full.svg: a belt corner carrying one item. This is a DIFFERENT
  DRAWING of that subject, not a smaller one.

  HAND-AUTHORED, NEVER SCALED (decision D-08). At 16px one device pixel is two units, so the
  full cut's 2u rails would each be half a device pixel and its 2u tread slats would be
  sub-pixel. Both would disappear or alias into grey. So the band goes SOLID at 8u, which is
  4 device pixels, the hollow goes, and all three slats go. This is what a 16px cut is for:
  remove elements, thicken what remains.

  THIS CANDIDATE FAILS THE GAP RULE HERE, ON PURPOSE, AND IS NOT REPAIRED.

  Once the hollow is gone there is nowhere for the item to sit except ON the band. It
  overlaps the ink rather than clearing it, so the gap rule reports OVERLAP rather than a
  measured distance, and OVERLAP is never rendered as a pass. Worse, and this is the half
  that decides routes: with the accent removed for the monochrome cut, the item is the same
  ink as the band and vanishes into it completely. In monochrome at 16px this candidate is a
  bare L with nothing inside it.

  Both facts are honest properties of Route 2 at this size, they are the single most
  decision-relevant thing the comparison sheet carries about this route, and they may be why
  it loses the vote. They are shown by name before the vote, never fixed quietly after it.
  Nudging the item to buy a 2u gap, or softening the pinned verdict, would turn the sheet
  into a comparison that cannot fail, which is the exact defect this phase exists to avoid.

  NOT A SHIPPED ASSET. This file is a throwaway comparison candidate. Nothing in the
  application imports it, and nothing renders it outside the Phase 79 comparison sheet.

  WHY IT IS NOT IN frontend/src/chrome/assets/ (decision D-09). The discovery walk in
  scripts/lint-svg.ts and in render/assets/vertexBudget.test.ts is flat and non-recursive, so
  a file dropped into that directory silently joins the shipped asset set and moves three
  hand-edited count literals. A file dropped into a subdirectory of it is worse: an asset
  that looks shipped and that no gate measures at all. Phase 79 leaves that directory
  byte-identical to where it started.

  THE TWO LAYERS, IN PAINT ORDER (later paints on top):

    1. band  fill  fab-ink           a solid L, 8u wide, entering the bottom, exiting right
    2. item  fill  fab-accent-item   a 4u square inset in the corner of the band

  Those paint tokens are named without their leading dashes on purpose. Two consecutive
  hyphens are illegal inside an XML comment, and that single character pair is what makes the
  shipped chrome/assets/logomark.svg unopenable by every strict parser in this tree. The fill
  attributes below sit outside the comment and keep their normal var(...) form.

  ART-04 PROVENANCE: authored from scratch for Phase 79. No icon pack was consulted, copied,
  traced or redrawn. Not game-icons.net, whose CC-BY-3.0 licence redrawing does not clear.
  Not Remix Icon, whose licence forbids logo use by name. No AI-generated image was used at
  any point.

  Geometry: integer coordinates only, commands limited to M H V L Z, zero curves, one path
  per semantic layer carrying its own stable data-part, one element per line.
-->
<svg viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg">
  <path data-part="band" d="M 8 32 V 8 H 32 V 16 H 16 V 32 Z" fill="var(--fab-ink)" />
  <path data-part="item" d="M 10 10 H 14 V 14 H 10 Z" fill="var(--fab-accent-item)" />
</svg>
