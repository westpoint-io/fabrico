<!--
  chrome/assets/label.svg - a CHROME GLYPH for the Palette's Label row (phase 76, SHAPE-10,
  UI-SPEC 1.2), and NOT canvas art. Nothing on the board renders it: a label's box is drawn
  by the machines layer's own label branch (`render/layers/machines.ts`), and its words by a
  DOM overlay. The Palette's Label row is this file's only consumer.

  THE MOTIF. A sheet with two lines of writing: a note. Every stroke is at the 2u DETAIL
  weight, so the glyph is lighter than every machine glyph (whose chassis is 3u), the same
  way the label box on the board (2 world px) is lighter than a machine chassis (3u). The
  sheet is OPEN (no fill) here; on the board the box is tinted, and that fill is what tells a
  note from a machine. The second line is shorter than the first, which is what makes the
  two strokes read as writing rather than as a second rail.

  GLYPH ONLY, AND NO CHASSIS, for the reason `wire.svg` gives: `SUBJECT_OF` has no key for a
  label (kind 11), so `MachineGlyphIcon kind={11}` would draw a bare chassis, which reads as
  an unknown machine. `LabelIcon` renders this file alone through `ChromeGlyphIcon`.

  This file sits FLAT in `chrome/assets/` so the non-recursive discovery walk in
  `scripts/lint-svg.ts` and `render/assets/vertexBudget.test.ts` measures it. THIS EDIT ADDS
  A FILE, so the two asset-count pins move 15 -> 16 by hand in the same commit.

  COLOUR: ZERO HEX. Authored as `currentColor`, so it inherits the palette row's ink and lifts
  on hover like every other chrome glyph.

  ART-04 PROVENANCE: authored from scratch for Phase 76. No icon pack was consulted, copied,
  traced or redrawn - not Material Symbols (permitted as a VOCABULARY REFERENCE ONLY), and not
  game-icons.net (CC-BY-3.0, which redrawing does not clear) or Remix Icon (non-OSI), which
  are excluded outright.

  Geometry: integer coordinates only, every coordinate EVEN, commands limited to M H V Z, zero
  curves, one <path> per semantic part carrying its own stable data-part, one element per
  line, explicit fill AND stroke on every path.
-->
<svg viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg">
  <path data-part="sheet" d="M 2 6 H 30 V 26 H 2 Z" fill="none" stroke="currentColor" stroke-width="2" />
  <path data-part="line-1" d="M 8 12 H 24" fill="none" stroke="currentColor" stroke-width="2" />
  <path data-part="line-2" d="M 8 18 H 20" fill="none" stroke="currentColor" stroke-width="2" />
</svg>
