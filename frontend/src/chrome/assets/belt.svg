<!--
  chrome/assets/belt.svg - a CHROME GLYPH, and NOT the canvas belt art. Read that first,
  because the two are easy to confuse and only one of them is locked. This file exists so
  the Palette's Belt tool and the Legend's Belt key have a vector glyph to draw; nothing
  on the board ever renders it. Canvas belts are governed by `53-BELT-LOCK.md` (the
  Direction B 10/6 centre-dash tread, re-locked 2026-07-26) as amended by the signed
  `61-BELT-LOCK-SUPERSESSION.md` (2026-08-09, the 20px lane), and are drawn by
  `render/synth/beltGeometry.ts`.

  PHASE 61 RECONCILED THIS ROW, 2026-08-10 (plan 61-03).
  This paragraph used to read "Phase 61 owns belt art and MUST reconcile this row: if the
  canvas tread is re-authored there, this glyph is the second declaration that has to move
  with it, or the chrome will quote a belt the board no longer draws." It was re-authored
  there, and this glyph moved with it: the rail CENTRELINES went from 16u apart to 20u
  apart (y = 6 and y = 26 of the 32-unit box) and the centre dashes from a 10u/8u pair to
  the locked 10u run / 6u gap rhythm the canvas tread actually marches.

  THE WORD "CENTRELINES" ABOVE IS LOAD-BEARING and was added by the phase-61 review. This
  line used to say "the rails went from the 16/32 lane to the 20/32 lane", which invites a
  comparison the two declarations do not support: at stroke-width 3 these rails ink
  4.5..7.5 and 24.5..27.5, so the glyph's outer-edge-to-outer-edge measure is 23u, while
  the canvas lane is defined OUTER edge to outer edge (`beltGeometry.ts` puts the rails
  INSIDE the lane edge, giving 20.00 world px). The two numbers are 20 for different
  reasons and the drawing is right either way - the even-coordinate contract below forces
  the glyph's choice - so this is a wording fix and not a geometry one. A future
  reconciliation must compare CENTRELINE to CENTRELINE.

  AND THE PHASE 59 DECOUPLING IS DELIBERATELY KEPT. This glyph still does NOT derive from
  the canvas geometry module - it imports nothing, it reads no constant, and reconciling it
  was a hand edit against measured proportions. Only the DRAWN PROPORTIONS were reconciled,
  never the mechanism. An icon and a tile are different subjects at different sizes: the
  glyph is authored on a 32-unit box in the chrome's two-weight system, while the canvas
  tile is world px on a 32px cell under `antialias: false`. Coupling them would make every
  future canvas-geometry edit a chrome edit, and would make this file's integer-and-even
  coordinate contract a hostage to a lane width that is free to become fractional. The
  correct standing arrangement is exactly what is here: two declarations, one owner phase,
  and a reconciliation recorded when they are brought into agreement.

  AND SINCE 2026-08-11 THE AGREEMENT IS MEASURED, not merely recorded (v7.0 milestone
  audit, W-1). `chrome/assets/beltGlyphGeometry.test.ts` reads this markup as TEXT and
  holds the PROPORTIONS the paragraphs above state - rail CENTRELINE spacing against
  `2 * BELT_GEOM.laneHalf`, and the run/gap/period against `dash`/`gap`/`BELT_DASH_PERIOD`
  - each as a fraction of the box against the same fraction of `CELL`. It gates neither
  the stroke weights (the chrome's own two-weight system) nor the outer-edge measure; it
  pins the 23u outer measure as DELIBERATELY unequal to the canvas 20, so the wording fix
  above cannot be undone by a later reader comparing the wrong pair of edges. The
  decoupling is untouched: still no import, still no constant read, still a hand edit.

  This file sits FLAT in `chrome/assets/`, and that placement is a contract rather than a
  convenience: the discovery walk in `scripts/lint-svg.ts` and
  `render/assets/vertexBudget.test.ts` is non-recursive, which is exactly what keeps
  candidate and fixture directories out of the shipped table. A shipped asset in a
  subdirectory is an asset no gate measures. NO FILE IS ADDED OR REMOVED BY THIS EDIT, so
  the two asset-count pins are untouched by it; plan 61-06 owns those when it adds a glyph.

  GLYPH ONLY, AND NO CHASSIS - for a different reason than the machine subjects have.
  `render/assets/*.svg` omit the chassis because it is drawn in CODE at whatever footprint
  a node has grown to. A belt omits it because a belt HAS no chassis on canvas: it is a
  lane, not a machine box. `BeltIcon` therefore renders this file alone, with no
  `chassisPathD` sibling, which is the one place the icon composition differs across the
  palette (`59-UI-SPEC.md`, "BELT is the exception").

  THE MOTIF. Two structural rails at 3u carrying the lane, and two 2u centre dashes between
  them - the reading a user already has of a belt from the board (a lane with a dashed
  centreline), at icon scale. The dash rhythm is now the locked 10u run with a 6u gap
  (`53-BELT-LOCK.md` axis 1), so the glyph quotes the rhythm the canvas marches rather than
  a rounded-off pair. The two runs sit at 0..10 and 16..26 of the 32u box, which is the
  canvas tread's own bucket-0 schedule read at icon scale; every coordinate stays EVEN.

  COLOUR: ZERO HEX, and this is where the chrome directory DIVERGES from
  `render/assets/`. Machine assets carry the one authored literal `#b0bacb`
  (`LOCKED_SKIN.palette.ramp[4]`) and the DOM icon rewrites it to `currentColor`. A chrome
  glyph is authored as `currentColor` from the start, because it has no canvas consumer to
  carry an ink for and because inheriting the control's own colour is what makes it lift
  on hover and desaturate with a disabled button. Held at `fail` severity by the
  chrome-scoped ink rule in `scripts/lint-svg.ts`.

  ART-04 PROVENANCE: authored from scratch for Phase 59, re-proportioned in place for
  Phase 61. No icon pack was consulted, copied, traced or redrawn - not Material Symbols
  (permitted as a VOCABULARY REFERENCE ONLY), and not game-icons.net (CC-BY-3.0, which
  redrawing does not clear) or Remix Icon (non-OSI), which are excluded outright.

  Geometry: integer coordinates only, every coordinate EVEN, commands limited to M H V L,
  zero curves, one <path> per semantic part carrying its own stable data-part, one element
  per line. 3u structural / 2u detail, the locked two-weight system.
-->
<svg viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg">
  <path data-part="rail-north" d="M 0 6 H 32" fill="none" stroke="currentColor" stroke-width="3" />
  <path data-part="rail-south" d="M 0 26 H 32" fill="none" stroke="currentColor" stroke-width="3" />
  <path data-part="tread-west" d="M 0 16 H 10" fill="none" stroke="currentColor" stroke-width="2" />
  <path data-part="tread-east" d="M 16 16 H 26" fill="none" stroke="currentColor" stroke-width="2" />
</svg>
