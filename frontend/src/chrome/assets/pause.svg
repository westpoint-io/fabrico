<!--
  chrome/assets/pause.svg - the transport PAUSE glyph. A CHROME GLYPH: nothing on the board
  ever renders it, and it has no canvas subject at all. `render/assets/*.svg` are machine
  art tessellated by Pixi; this directory is consumed by the DOM only.

  This file sits FLAT in `chrome/assets/`, and that placement is a contract rather than a
  convenience: the discovery walk in `scripts/lint-svg.ts` and
  `render/assets/vertexBudget.test.ts` is non-recursive, which is exactly what keeps
  candidate and fixture directories out of the shipped table. A shipped asset in a
  subdirectory is an asset no gate measures.

  THE MOTIF. Two solid vertical bars - the universal transport "halt" mark, carried from
  the 8x8 bit matrix this file replaces (`icons.tsx` PAUSE, deleted in plan 59-02). The
  bars are 6u wide with a 4u gap, spanning x 8..24 so the pair is centred on the box; the
  matrix's 2-bit bars were the widest the 8x8 grid could carry and are not a proportion
  worth transcribing. It pairs with `play.svg` at the SAME optical mass, because the two
  swap in one button and a mass change would read as the button jumping.

  COLOUR: ZERO HEX. Every fill and stroke is literally `currentColor`, so the glyph takes
  the colour of the control it sits in - it brightens with `.fab-tool-btn:hover` and
  desaturates with `:disabled`. A baked value would do neither, silently. Held at `fail`
  severity by the chrome-scoped ink rule in `scripts/lint-svg.ts`.

  ART-04 PROVENANCE: authored from scratch for Phase 59. No icon pack was consulted,
  copied, traced or redrawn - not Material Symbols (permitted as a VOCABULARY REFERENCE
  ONLY), and not game-icons.net (CC-BY-3.0, which redrawing does not clear) or Remix Icon
  (non-OSI), which are excluded outright.

  Geometry: integer coordinates only, every coordinate EVEN, commands limited to M H V L
  Z, zero curves, one <path> per semantic part carrying its own stable data-part, one
  element per line. 3u structural / 2u detail, the locked two-weight system.
-->
<svg viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg">
  <path data-part="bar-west" d="M 8 6 H 14 V 26 H 8 Z" fill="currentColor" />
  <path data-part="bar-east" d="M 18 6 H 24 V 26 H 18 Z" fill="currentColor" />
</svg>
