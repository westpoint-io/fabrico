  <path data-part="eye" d="M 10 16 L 16 10 L 22 16 L 16 22 Z" fill="none" stroke="#b0bacb" stroke-width="2" />
  <path data-part="pupil" d="M 14 14 H 18 V 18 H 14 Z" fill="#b0bacb" />
</svg>
