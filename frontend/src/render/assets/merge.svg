<!--
  render/assets/merge.svg - SHIPPED art for the MERGE machine (ART-01/ART-04, plan 58-02).

  Promoted from `candidates/a/merge.svg`, the Direction A draft judged on the Phase 57
  art board and locked (`57-ART-LOCK.md`). This file sits FLAT in `render/assets/`, and
  that placement is a contract rather than a convenience: the discovery walk in
  `scripts/lint-svg.ts`, `vertexBudget.test.ts` and `geometryDigest.test.ts` is
  non-recursive, which is exactly what keeps `candidates/` and `__fixtures__/` out of the
  shipped table. A shipped asset in a subdirectory is an asset no gate measures.

  GLYPH ONLY - NO CHASSIS PATH, NO PORT STUBS (design decision, 2026-08-02). The CHASSIS is
  drawn in CODE (`render/layers/machineChassis.ts`) at whatever `w x h` the footprint
  actually is, and the PORT STUBS stay board-drawn from the authoritative `ports[]`. A
  MERGE is the other kind users routinely grow through `+ Add output`, so a frozen stub
  layout would be wrong the moment they did.

  FOOTPRINT: MERGE's base footprint is 2x2, so `viewBox 0 0 64 64`.

  SEMANTIC VOCABULARY - CARRIED. `synth/glyphs.ts:100-102` reads the MERGE as a
  many-to-one funnel: a wide top `mouth` converging down two diagonal walls to a single
  centred `neck`. The strong top-heavy taper is the property doing the discriminating and
  it is drawn strongly rather than politely.

  THIS IS THE MASS-DISTRIBUTION HALF OF THE DESIGN RULING (2026-08-01). BALANCER and MERGE are
  the same 4u-inset rectangle under Direction A's shared outline, so the glyph is the only
  separator: BALANCER puts mass at the FOUR CORNERS and is symmetric about BOTH axes; MERGE
  puts mass at the TOP, funnels, and is symmetric about ONE axis only. Stated so it is
  checkable: mirror about x = 32 and this glyph maps onto itself; mirror about y = 32 and
  it does NOT - the mouth would land where the neck is. That asymmetry IS the discriminator,
  and ART-03's gate must be able to fail on it, with no exemption and no allowlist entry.

  THE FLOW AXIS IS MIXED ON PURPOSE. MERGE flows top-to-bottom while TEE and BALANCER flow
  left-to-right. The candidate header flagged "whether the shipped machine set tolerates
  mixed flow axes is a Phase 58 question". IT DOES, AND IT MUST: the funnel's vertical taper
  IS the horizontal-mirror asymmetry above, so rotating MERGE onto the horizontal to match
  its siblings would collapse the chosen discriminator. The mixed axis is load-bearing, not
  an inconsistency to tidy away.

  FILL COUNT 0.

  ART-04 PROVENANCE: authored from scratch for the Phase 57 board. No icon pack was
  consulted, copied, traced or redrawn - not Material Symbols (permitted as a VOCABULARY
  REFERENCE ONLY), and not game-icons.net (CC-BY-3.0, which redrawing does not clear) or
  Remix Icon (non-OSI), which are excluded outright. Promotion carries that provenance
  forward unchanged.

  COLOUR SOURCE - THE SHIPPED RULE, NOT THE CANDIDATE'S EXEMPTION. Every draft in
  `candidates/` is exempt from the "no hand-authored hex" rule BECAUSE IT NEVER SHIPS.
  This file ships, so that basis evaporates and is deliberately not restated. The standing
  rule stands: the one literal below is `LOCKED_SKIN.palette.ramp[4]` (0xb0bacb, the
  highlight step), the single ink lock axis 9 permits for every kind's glyph, and it is
  held to that value by the fail-severity ink allowlist over the SHIPPED assets in
  `assets/shippedAssets.test.ts` - by a gate, not by this paragraph.

  Geometry: integer coordinates only, every coordinate EVEN, commands limited to M H V L Z,
  zero curves, one `<path>` per semantic part carrying its own stable `data-part`, one
  element per line. The authoring contract is render/assets/README.md.
-->
<svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
  <path data-part="mouth" d="M 12 16 H 52" fill="none" stroke="#b0bacb" stroke-width="2" />
  <path data-part="wall-left" d="M 12 16 L 32 38" fill="none" stroke="#b0bacb" stroke-width="2" />
  <path data-part="wall-right" d="M 52 16 L 32 38" fill="none" stroke="#b0bacb" stroke-width="2" />
  <path data-part="neck" d="M 32 38 V 50" fill="none" stroke="#b0bacb" stroke-width="2" />
</svg>
