<!--
  render/assets/tee.svg - SHIPPED art for the TEE machine (ART-01/ART-04, plan 58-01).

  Promoted from `candidates/a/tee.svg`, the Direction A draft judged on the Phase 57
  art board and locked (`57-ART-LOCK.md`). This file sits FLAT in `render/assets/`, and
  that placement is a contract rather than a convenience: the discovery walk in
  `scripts/lint-svg.ts`, `vertexBudget.test.ts` and `geometryDigest.test.ts` is
  non-recursive, which is exactly what keeps `candidates/` and `__fixtures__/` out of the
  shipped table. A shipped asset in a subdirectory is an asset no gate measures.

  GLYPH ONLY - NO CHASSIS PATH, NO PORT STUBS. This is the one structural difference from
  the candidate, and it is a design decision of 2026-08-02:

    - The CHASSIS is drawn in CODE (`render/layers/machineChassis.ts`) at whatever `w x h`
      the footprint actually is. A user can grow a machine's footprint through the shipped
      `+ Add output` gesture and `grow_to_fit` clamps only at 64, so a fixed-`viewBox`
      asset has no legal box for a grown machine. Two numbers - 4u inset, 3u stroke - draw
      every footprint; artwork cannot.
    - The PORT STUBS stay board-drawn from the authoritative `ports[]` via `localNubSpecs`
      / `drawRoleNub`, which already carry the role silhouettes, the fault ring and the
      state recolour. Authoring them here would double-draw every nub and freeze a port
      layout into artwork.

  FOOTPRINT: TEE's base footprint is 2x2, so `viewBox 0 0 64 64` - the true box, authored
  at 64x64 and never at 32x32 scaled up. A 2u stroke on a scaled 32x32 author box would
  rasterise at 4px here and 2px on a 1x1 SOURCE, and the locked two-weight stroke system
  would then mean a different thing on every kind.

  SEMANTIC VOCABULARY - CARRIED. `synth/glyphs.ts:55-57` says of TEE: "one-IN / two-OUT
  fork ... Silhouette reads as an opening '<': clearly not a funnel or a diamond." That
  reading is the whole point of the motif: `spine` is the single input entering from the
  left, and `fork-up` / `fork-down` diverge to the right. The DIVERGENCE is the
  load-bearing property - it is what separates TEE from MERGE, whose taper runs the other
  way, and from BALANCER, whose bars are parallel. Three kinds that are trivially
  confusable at 1x if their glyphs are not doing that work.

  ART-04 PROVENANCE: authored from scratch for the Phase 57 board. No icon pack was
  consulted, copied, traced or redrawn - not Material Symbols (permitted as a VOCABULARY
  REFERENCE ONLY), and not game-icons.net (CC-BY-3.0, which redrawing does not clear) or
  Remix Icon (non-OSI), which are excluded outright. Promotion carries that provenance
  forward unchanged.

  COLOUR SOURCE - AND WHY THE CANDIDATE'S EXEMPTION DOES NOT COME WITH IT. Every draft in
  `candidates/` is exempt from the "no hand-authored hex" rule BECAUSE IT NEVER SHIPS.
  This file ships, so that basis evaporates and is deliberately not restated. The standing
  rule stands: the one literal below is `LOCKED_SKIN.palette.ramp[4]` (0xb0bacb, the
  highlight step), the single ink lock axis 9 permits for every kind's glyph, and it is
  held to that value by a fail-severity gate over the SHIPPED assets rather than by this
  comment. Plan 58-02 builds that gate. Until it lands, this paragraph is a claim; after
  it lands, it is checked.

  Geometry: integer coordinates only, every coordinate EVEN, commands limited to M H V L,
  zero curves, one `<path>` per semantic part carrying its own stable `data-part`, one
  element per line. The authoring contract is render/assets/README.md.
-->
<svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
  <path data-part="spine" d="M 14 32 H 34" fill="none" stroke="#b0bacb" stroke-width="2" />
  <path data-part="fork-up" d="M 34 32 L 48 18" fill="none" stroke="#b0bacb" stroke-width="2" />
  <path data-part="fork-down" d="M 34 32 L 48 46" fill="none" stroke="#b0bacb" stroke-width="2" />
</svg>
