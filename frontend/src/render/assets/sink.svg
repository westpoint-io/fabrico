<!--
  render/assets/sink.svg - SHIPPED art for the SINK machine (ART-01/ART-04, plan 58-02).

  Promoted from `candidates/a/sink.svg`, the Direction A draft judged on the Phase 57
  art board and locked (`57-ART-LOCK.md`). This file sits FLAT in `render/assets/`, and
  that placement is a contract rather than a convenience: the discovery walk in
  `scripts/lint-svg.ts`, `vertexBudget.test.ts` and `geometryDigest.test.ts` is
  non-recursive, which is exactly what keeps `candidates/` and `__fixtures__/` out of the
  shipped table. A shipped asset in a subdirectory is an asset no gate measures.

  GLYPH ONLY - NO CHASSIS PATH, NO PORT STUBS (design decision, 2026-08-02). The CHASSIS is
  drawn in CODE (`render/layers/machineChassis.ts`) at whatever `w x h` the footprint
  actually is, because `grow_to_fit` can push a machine past its base footprint and a
  fixed-`viewBox` asset then has no legal box. The PORT STUBS stay board-drawn from the
  authoritative `ports[]` via `localNubSpecs` / `drawRoleNub`, which already carry the role
  silhouettes, the fault ring and the state recolour.

  FOOTPRINT: SINK's base footprint is 1x1, so `viewBox 0 0 32 32` - the true box, authored
  at 32x32 and never at 64x64 scaled down.

  SEMANTIC VOCABULARY - CARRIED. `synth/glyphs.ts:42` says of SINK: bullseye - launch the
  rocket, the terminal machine. `ring` is the outer target and `core` is the filled centre.
  Square rings stand in for circular ones (lock axis 8's named substitution): the reading
  is preserved, the construction is re-expressed in a language with zero curve commands.

  MUST NOT BE CONFUSABLE WITH two neighbours, and both discriminators are geometric:

    - SOURCE. Same footprint, same fill count, concentric in the same way. The separation
      is edge ORIENTATION: this ring's four edges are all AXIS-ALIGNED, the SOURCE lens's
      four edges are all DIAGONAL. Nothing else distinguishes the pair in greyscale.
    - ENDPOINT. This ring is CLOSED on all four sides; the endpoint's socket is OPEN on
      one. Closure is the property, and it is why `ring` ends in `Z` and `socket` does not.

  FILL COUNT 1 (`core`). Lock axis 6 states 1 as a MAXIMUM, so this subject sits exactly at
  the ceiling and cannot gain a second filled path.

  ART-04 PROVENANCE: authored from scratch for the Phase 57 board. No icon pack was
  consulted, copied, traced or redrawn - not Material Symbols (permitted as a VOCABULARY
  REFERENCE ONLY), and not game-icons.net (CC-BY-3.0, which redrawing does not clear) or
  Remix Icon (non-OSI), which are excluded outright. Promotion carries that provenance
  forward unchanged.

  COLOUR SOURCE - THE SHIPPED RULE, NOT THE CANDIDATE'S EXEMPTION. Every draft in
  `candidates/` is exempt from the "no hand-authored hex" rule BECAUSE IT NEVER SHIPS.
  This file ships, so that basis evaporates and is deliberately not restated. The standing
  rule stands: the one literal below is `LOCKED_SKIN.palette.ramp[4]` (0xb0bacb, the
  highlight step), the single ink lock axis 9 permits for every kind's glyph, and it is
  held to that value by the fail-severity ink allowlist over the SHIPPED assets in
  `assets/shippedAssets.test.ts` - by a gate, not by this paragraph.

  Geometry: integer coordinates only, every coordinate EVEN, commands limited to M H V L Z,
  zero curves, one `<path>` per semantic part carrying its own stable `data-part`, one
  element per line. The authoring contract is render/assets/README.md.
-->
