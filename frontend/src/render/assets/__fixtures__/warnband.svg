<!--
  warnband.svg - a MEASURED band fixture for the vertex budget gate (VEC-04, Plan 56-05).

  40 filled 1u squares on the integer grid. Filled 1u squares tessellate at exactly
  8n vertices - MEASURED through GraphicsContextSystem.updateGpuContext, never estimated -
  so this file measures 8 * 40 = 320 vertices (160 points).
  assets/vertexBudget.test.ts asserts that exact number. The 8n formula assertion is what
  stops this fixture silently drifting into a different band under an edit; the UI-SPEC
  suggestion it replaces (a 60-segment stroked zigzag) measures 244, roughly 40% short.

  THIS FILE LIVES OUTSIDE THE PRODUCTION WALK ON PURPOSE. render/assets/__fixtures__/ is
  one directory below render/assets/, and the .svg discovery every gate shares is
  NON-RECURSIVE - a contract plan 56-04 owns and asserts itself (lintSvg.test.ts, "walks
  render/assets/ NON-RECURSIVELY, so the deliberately non-conforming fixtures are
  invisible to it"). That is what keeps the geometry digest table key set equal to the
  shipped asset set rather than polluted by a deliberately over-budget file.

  It is otherwise fully format-conforming: viewBox 0 0 32 32, integer coordinates only,
  one element per line, a stable part attribute on every path, an explicit fill. The ONLY
  thing wrong with this file is its size, which is the single property under test.
-->
