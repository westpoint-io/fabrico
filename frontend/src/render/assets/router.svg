  <path data-part="diamond" d="M 32 24 L 54 48 L 32 72 L 10 48 Z" fill="none" stroke="#b0bacb" stroke-width="2" />
  <path data-part="switch" d="M 28 44 H 36 V 52 H 28 Z" fill="#b0bacb" />
