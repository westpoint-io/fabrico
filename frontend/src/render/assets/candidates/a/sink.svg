<!--
  candidates/a/sink.svg - DIRECTION A draft for the SINK machine (BOARD-01, plan 57-04).

  A DRAFT, NOT SHIPPED ART. Phase 57 locks a DIRECTION; Phase 58 authors the art. The
  never-ships boundary, the colour-source exemption and the ART-04 policy are stated once
  in candidates/README.md and are not repeated here.

  FOOTPRINT: 1x1 -> viewBox 0 0 32 32, the true base footprint (crates/fabrico-core
  base_footprint, frozen). Authored at its real size, never at 32x32 scaled.

  DIRECTION A - "blueprint continuation" (57-CONTEXT D-02): an open chassis whose
  structure is carried by the 3-unit outline stroke, with minimal fill. Stroke system,
  identical across every subject in this direction so the board compares DIRECTIONS and
  not inconsistencies: 3u structural (the chassis), 2u detail (glyph and port stubs).
  The chassis sits 4 units in from the cell edge on every subject, 1x1 through 3x3, so a
  bigger machine reads as the same chassis language at a bigger size rather than as a
  differently-proportioned one.

  SEMANTIC VOCABULARY - CARRIED. synth/glyphs.ts:42 says of SINK: "bullseye (launch the
  rocket / terminal)". The bullseye is concentric by definition, and this draft carries it
  concentrically: `ring` is the outer band, `core` the filled centre. The rings are SQUARE
  rather than circular because this direction has zero curves, and square also does the
  discriminating work at 1x - a round-ish SINK and the diamond-lensed SOURCE next to it
  would read as the same machine at 32px. The second cue is the port: SINK terminates, so
  it carries an inbound stub on the LEFT and no outflow. Whether Phase 58's shipped SINK
  keeps the bullseye is a Phase 58 decision, not one this draft makes.

  ART-04 PROVENANCE: authored from scratch for this board. No icon pack was consulted,
  copied, traced or redrawn - not Material Symbols (permitted as a VOCABULARY REFERENCE
  ONLY), and not game-icons.net or Remix Icon, which are excluded outright.

  Colour literals are the named LOCKED_SKIN ramp values; see candidates/README.md for the
  exemption and the value table.
-->
<svg viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg">
  <path data-part="chassis" d="M4 4 H28 V28 H4 Z" fill="none" stroke="#b0bacb" stroke-width="3" />
  <path data-part="ring" d="M10 10 H22 V22 H10 Z" fill="none" stroke="#b0bacb" stroke-width="2" />
  <path data-part="core" d="M14 14 H18 V18 H14 Z" fill="#b0bacb" />
  <path data-part="port-in" d="M0 16 H4" fill="none" stroke="#565f70" stroke-width="2" />
</svg>
