<!--
  candidates/a/balancer.svg - DIRECTION A draft for the BALANCER (BOARD-01, plan 57-04).

  A DRAFT, NOT SHIPPED ART. Phase 57 locks a DIRECTION; Phase 58 authors the art. The
  never-ships boundary, the colour-source exemption and the ART-04 policy are stated once
  in candidates/README.md and are not repeated here.

  FOOTPRINT: 2x2 -> viewBox 0 0 64 64, the true base footprint, authored at its real size.

  DIRECTION A - "blueprint continuation": open chassis, 3u structural outline, 2u detail,
  minimal fill, chassis inset 4 units from the cell edge on every subject.

  SEMANTIC VOCABULARY - CARRIED. synth/glyphs.ts:70-72 says of BALANCER: "parallel even
  split: two full-width horizontal bars joined by a central spine (an 'I'). The two opposed
  bars are the even-split motif; the silhouette is unmistakably a pair of rails, never a
  fork or a diamond." This draft is that, unchanged in reading: `bar-top` and `bar-bottom`
  are the two rails, `spine` is the joining stem. PARALLEL is the load-bearing property -
  the instant the bars converge or diverge the machine reads as a MERGE or a TEE, and the
  three become one blurry family at 1x.

  The ports carry the same claim structurally, which is why there are four rather than two:
  two in on the left and two out on the right, aligned to the rails. An even split with a
  single inbound stub would be drawing a claim the glyph does not make.

  ART-04 PROVENANCE: authored from scratch for this board. No icon pack was consulted,
  copied, traced or redrawn - not Material Symbols (permitted as a VOCABULARY REFERENCE
  ONLY), and not game-icons.net or Remix Icon, which are excluded outright.

  Colour literals are the named LOCKED_SKIN ramp values; see candidates/README.md.
-->
