<!--
  candidates/a/tee.svg - DIRECTION A draft for the TEE machine (BOARD-01, plan 57-04).

  A DRAFT, NOT SHIPPED ART. Phase 57 locks a DIRECTION; Phase 58 authors the art. The
  never-ships boundary, the colour-source exemption and the ART-04 policy are stated once
  in candidates/README.md and are not repeated here.

  FOOTPRINT: 2x2 -> viewBox 0 0 64 64, the true base footprint. AUTHORED AT 64x64, never
  at 32x32 and scaled: a 3-unit stroke on a scaled 32x32 author box would rasterise at 6px
  here and 3px on a SOURCE, and the stroke system BOARD-02 is meant to lock would then
  mean a different thing on every kind.

  DIRECTION A - "blueprint continuation": open chassis, 3u structural outline, 2u detail,
  minimal fill, chassis inset 4 units from the cell edge on every subject.

  SEMANTIC VOCABULARY - CARRIED. synth/glyphs.ts:55-57 says of TEE: "one-IN / two-OUT fork
  ... Silhouette reads as an opening '<': clearly not a funnel or a diamond." That reading
  is the whole point of the motif and this draft keeps it: `spine` is the single input
  entering from the left, and `fork-up` / `fork-down` diverge to the right. The divergence
  is what separates TEE from MERGE, whose taper runs the other way, and from BALANCER,
  whose bars are parallel - three kinds that are trivially confusable at 1x if their
  glyphs are not doing that work. The port stubs repeat the reading structurally: one in,
  two out.

  ART-04 PROVENANCE: authored from scratch for this board. No icon pack was consulted,
  copied, traced or redrawn - not Material Symbols (permitted as a VOCABULARY REFERENCE
  ONLY), and not game-icons.net or Remix Icon, which are excluded outright.

  Colour literals are the named LOCKED_SKIN ramp values; see candidates/README.md.
-->
