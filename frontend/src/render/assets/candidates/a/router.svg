<!--
  candidates/a/router.svg - DIRECTION A draft for the ROUTER machine (BOARD-01, plan 57-04).

  A DRAFT, NOT SHIPPED ART. Phase 57 locks a DIRECTION; Phase 58 authors the art. The
  never-ships boundary, the colour-source exemption and the ART-04 policy are stated once
  in candidates/README.md and are not repeated here.

  FOOTPRINT: 2x3 -> viewBox 0 0 64 96, the true base footprint and the ONLY subject that
  uses it. Authored at its real size: 64 wide by 96 tall, never a 32x32 box scaled or a
  transposed 96x64 (a footprint no machine has, and the exact value the lint's four-literal
  whitelist exists to reject).

  DIRECTION A - "blueprint continuation": open chassis, 3u structural outline, 2u detail,
  minimal fill, chassis inset 4 units from the cell edge on every subject.

  SEMANTIC VOCABULARY - CARRIED. synth/glyphs.ts:85-87 says of ROUTER: "decision diamond
  with a central switch cell. A clean diamond OUTLINE (single-cell top/bottom apex, widest
  equator touching both edges) with an inner dot on the equator - the 'decide which way'
  motif." Carried as `diamond` (the outline) and `switch` (the filled centre cell). The
  diamond is the one flowchart borrowing in the set and it earns its place: nothing else
  says "a decision happens here" as fast, and the tall 2x3 chassis gives it the vertical
  room to be a real diamond rather than a squashed one.

  THE DIAMOND IS THE ONE PLACE THIS DIRECTION'S ZERO-CURVE RULE COSTS NOTHING, which is
  worth recording while the board is being judged: a diamond is four straight segments, so
  it is exact at 1x, 1.77x and 2x, while a circular "decision" badge would tessellate once
  at scale 1 and serve faceted geometry at the zoomed rows.

  ART-04 PROVENANCE: authored from scratch for this board. No icon pack was consulted,
  copied, traced or redrawn - not Material Symbols (permitted as a VOCABULARY REFERENCE
  ONLY), and not game-icons.net or Remix Icon, which are excluded outright.

  Colour literals are the named LOCKED_SKIN ramp values; see candidates/README.md.
-->
