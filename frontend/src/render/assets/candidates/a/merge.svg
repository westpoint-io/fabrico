<!--
  candidates/a/merge.svg - DIRECTION A draft for the MERGE machine (BOARD-01, plan 57-04).

  A DRAFT, NOT SHIPPED ART. Phase 57 locks a DIRECTION; Phase 58 authors the art. The
  never-ships boundary, the colour-source exemption and the ART-04 policy are stated once
  in candidates/README.md and are not repeated here.

  FOOTPRINT: 2x2 -> viewBox 0 0 64 64, the true base footprint, authored at its real size.

  DIRECTION A - "blueprint continuation": open chassis, 3u structural outline, 2u detail,
  minimal fill, chassis inset 4 units from the cell edge on every subject.

  SEMANTIC VOCABULARY - CARRIED. synth/glyphs.ts:100-102 says of MERGE: "many-to-one
  funnel: a wide top mouth converges down diagonal walls to a single 1-wide centered neck.
  The strong top-heavy taper is the inverse of TEE's fork and cannot be confused with the
  balancer's twin bars." Every clause of that is carried: `mouth` is the wide top,
  `wall-left` and `wall-right` are the converging diagonals, `neck` is the single outflow.
  The TOP-HEAVY TAPER is the property doing the discriminating - it is the only thing
  keeping MERGE, TEE and BALANCER apart at 1x, so it is drawn strongly rather than
  politely.

  ROTATED RELATIVE TO ITS SIBLINGS, and that is deliberate. TEE and BALANCER flow
  left-to-right; MERGE flows top-to-bottom, because a funnel that converges horizontally is
  a TEE read backwards. The ports follow the flow: two in on the top edge, one out on the
  bottom. Whether the shipped machine set tolerates mixed flow axes is a Phase 58 question,
  and stating it here is the point of the board.

  ART-04 PROVENANCE: authored from scratch for this board. No icon pack was consulted,
  copied, traced or redrawn - not Material Symbols (permitted as a VOCABULARY REFERENCE
  ONLY), and not game-icons.net or Remix Icon, which are excluded outright.

  Colour literals are the named LOCKED_SKIN ramp values; see candidates/README.md.
-->
