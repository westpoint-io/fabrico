  <path data-part="outline" d="M4 4 H92 V92 H4 Z" fill="none" stroke="#2a2f3a" stroke-width="3" />
  <path data-part="brace-left" d="M44 26 H32 V44 H24 V52 H32 V70 H44" fill="none" stroke="#1b1f27" stroke-width="2" />
  <path data-part="brace-right" d="M52 26 H64 V44 H72 V52 H64 V70 H52" fill="none" stroke="#1b1f27" stroke-width="2" />
  <path data-part="port-in" d="M0 48 H4" fill="none" stroke="#565f70" stroke-width="2" />
