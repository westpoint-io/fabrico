<!--
  candidates/b/factory.svg - DIRECTION B draft for the FACTORY machine (BOARD-01, plan 57-04).

  A DRAFT, NOT SHIPPED ART. Phase 57 locks a DIRECTION; Phase 58 authors the art. The
  never-ships boundary, the colour-source exemption and the ART-04 policy are stated once
  in candidates/README.md and are not repeated here.

  FOOTPRINT: 3x3 -> viewBox 0 0 96 96, the largest in the set and the HERO machine (it is
  the one that runs user JS). Authored at 96x96 because 96px is what ships.

  THE HERO IS NOT BUDGET-CONSTRAINED, and this draft is not simplified as though it were.
  MEASURED (57-RESEARCH F2.1): identical geometry authored at 0 0 32 32 and at 0 0 96 96
  tessellates to BYTE-IDENTICAL vertex counts - 32 verts at all four legal viewBoxes. The
  400-vertex ceiling means exactly the same thing on a FACTORY as on a SOURCE.

  DIRECTION B - "solid chassis plate": a FILLED chassis body (#565f70), a 3-unit dark
  outline (#2a2f3a), and a 2-unit glyph knocked out in the substrate value (#1b1f27). Port
  stubs are HELD CONSTANT with Direction A (same geometry, same #565f70, same 2u) so the
  board compares chassis and glyph treatment rather than port treatment. Glyph geometry is
  identical to Direction A's: D-02 defines B as a treatment, not a different drawing.

  THE HERO IS WHERE THE TWO DIRECTIONS DIVERGE MOST, and the divergence is a real finding
  rather than a drawing choice: 96x96 of solid #565f70 is by far the largest mass of flat
  chassis hue anywhere on the board, so if "machine kind reads as a chassis-hue family"
  becomes "the canvas is dominated by big grey slabs", this cell is where it shows. The
  same 96x96 in Direction A is mostly cell background. Neither is corrected toward the
  other; the contrast IS the instrument.

  SEMANTIC VOCABULARY - CARRIED. synth/glyphs.ts:16 says of FACTORY: "code braces { }, the
  hero machine." Carried as `brace-left` and `brace-right`. The braces are the one motif in
  the set that says WHAT THIS MACHINE IS rather than what it does to flow: a factory runs
  user JavaScript, and braces are the shortest way to say "your code goes here" to the
  automation half of the audience. Both braces are drawn as pure H/V runs with a mid-height
  nub, so the glyph is exact at every zoom the board shows.

  ART-04 PROVENANCE: authored from scratch for this board. No icon pack was consulted,
  copied, traced or redrawn - not Material Symbols (permitted as a VOCABULARY REFERENCE
  ONLY), and not game-icons.net or Remix Icon, which are excluded outright.

  Colour literals are the named LOCKED_SKIN ramp values; see candidates/README.md.
-->
