  <path data-part="chassis" d="M4 4 H60 V92 H4 Z" fill="#565f70" />
  <path data-part="outline" d="M4 4 H60 V92 H4 Z" fill="none" stroke="#2a2f3a" stroke-width="3" />
  <path data-part="diamond" d="M32 24 L54 48 L32 72 L10 48 Z" fill="none" stroke="#1b1f27" stroke-width="2" />
  <path data-part="switch" d="M28 44 H36 V52 H28 Z" fill="#1b1f27" />
  <path data-part="port-in" d="M0 48 H4" fill="none" stroke="#565f70" stroke-width="2" />
  <path data-part="port-out-a" d="M60 30 H64" fill="none" stroke="#565f70" stroke-width="2" />
  <path data-part="port-out-b" d="M60 66 H64" fill="none" stroke="#565f70" stroke-width="2" />
</svg>
