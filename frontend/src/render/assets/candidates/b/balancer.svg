  <path data-part="outline" d="M4 4 H60 V60 H4 Z" fill="none" stroke="#2a2f3a" stroke-width="3" />
  <path data-part="bar-top" d="M14 20 H50" fill="none" stroke="#1b1f27" stroke-width="2" />
