  <path data-part="spine" d="M32 20 V44" fill="none" stroke="#1b1f27" stroke-width="2" />
  <path data-part="port-in-a" d="M0 20 H4" fill="none" stroke="#565f70" stroke-width="2" />
  <path data-part="port-in-b" d="M0 44 H4" fill="none" stroke="#565f70" stroke-width="2" />
