<!--
  candidates/c/endpoint.svg - DIRECTION C draft for the ENDPOINT machine (BOARD-01, plan 57-05).

  A DRAFT, NOT SHIPPED ART. Phase 57 locks a DIRECTION; Phase 58 authors the art. The
  never-ships boundary, the colour-source exemption and the ART-04 policy are stated once
  in candidates/README.md and are not repeated here.

  FOOTPRINT: 1x1 -> viewBox 0 0 32 32, the true base footprint, authored at its real size.

  DIRECTION C - "iconographic badge": the silhouette itself differs per kind. C holds
  Direction B's paint system exactly so that B vs C isolates the SILHOUETTE with the
  treatment held fixed. See c/source.svg for the full statement of that control.

  THIS CANDIDATE PROPOSES A CHASSIS THAT DOES NOT EXIST TODAY, and says so exactly as the
  a/ and b/ endpoint candidates do. The shipped ENDPOINT has NO generator at all
  (`GEN_KEY_OF` has exactly eight entries; kind 9 is absent) and its only visual is the
  asymmetric wire-terminal inlet glyph drawn by the wires layer at a port
  (layers/inletGlyph.ts, INLET_HALF = 7). The board's `TODAY` column therefore has no
  endpoint cell to compare any of these three against.

  SEMANTIC VOCABULARY - NO MOTIF TO INHERIT, so one is PROPOSED from the shipped inlet
  glyph rather than from glyphs.ts (which has no ENDPOINT entry). inletGlyph.ts's canonical
  east-facing form is an open-mouth socket "C" whose aperture opens toward the cable side
  (+x) with a chevron apex pointing INTO the endpoint (-x). Direction C promotes that
  socket from an interior mark to THE SILHOUETTE: the badge's right edge carries the socket
  mouth as a real notch, so the incoming terminal stub visibly plugs into the shape. The
  chevron survives as the only interior detail, keeping the request-in reading (D-01).

  ART-04 PROVENANCE: authored from scratch for this board. No icon pack was consulted,
  copied, traced or redrawn - not Material Symbols (permitted as a VOCABULARY REFERENCE
  ONLY), and not game-icons.net or Remix Icon, which are excluded outright.

  MEASURED: 76 vertices / 38 points, band `ok`.

  Colour literals are the named LOCKED_SKIN ramp values; see candidates/README.md.
-->
