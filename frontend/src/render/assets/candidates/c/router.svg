<!--
  candidates/c/router.svg - DIRECTION C draft for the ROUTER machine (BOARD-01, plan 57-05).

  A DRAFT, NOT SHIPPED ART. Phase 57 locks a DIRECTION; Phase 58 authors the art. The
  never-ships boundary, the colour-source exemption and the ART-04 policy are stated once
  in candidates/README.md and are not repeated here.

  FOOTPRINT: 2x3 -> viewBox 0 0 64 96, the only non-square footprint in the set and the true
  base footprint, authored at its real size.

  DIRECTION C - "iconographic badge": the silhouette itself differs per kind. C holds
  Direction B's paint system exactly so that B vs C isolates the SILHOUETTE with the
  treatment held fixed. See c/source.svg for the full statement of that control.

  SEMANTIC VOCABULARY - CARRIED, AND PROMOTED FROM GLYPH TO SILHOUETTE, WITH ONE DELIBERATE
  COMPROMISE. synth/glyphs.ts:85-87 says of ROUTER: "a clean diamond OUTLINE ... with an
  inner dot on the equator - the 'decide which way' motif". The decision diamond becomes the
  badge here, but it is drawn as an elongated HEXAGON rather than a true 4-point diamond, and
  the reason is the held-constant ports rather than taste: the two outlets sit at y=30 and
  y=66, 36 units apart, and a true diamond on a 64x96 footprint has a single right-hand
  vertex at y=48 that both outlets would have to leave from the same point. Squaring the
  equator into a 44-unit vertical face at x=60 gives each outlet its own edge to leave from
  while keeping the diamond reading intact. The interior `switch` dot is kept from the
  matrix's equator cell.

  THE COMPROMISE IS RECORDED RATHER THAN HIDDEN because it is a genuine cost of Direction C:
  when the silhouette carries the meaning, the PORTS constrain the meaning. A and B never
  face this - their chassis is a rectangle with edges everywhere, so ports attach anywhere
  and the glyph is free. In C every port is a point the outline must reach, and on the two
  subjects with three or more ports (this one, tee, balancer) that pushed the shape away
  from the motif's ideal form. Whether that constraint is acceptable is part of what is
  being judged about C, so it is stated on the board rather than solved quietly.

  ART-04 PROVENANCE: authored from scratch for this board. No icon pack was consulted,
  copied, traced or redrawn - not Material Symbols (permitted as a VOCABULARY REFERENCE
  ONLY), and not game-icons.net or Remix Icon, which are excluded outright.

  MEASURED: 76 vertices / 38 points, band `ok` - the CHEAPEST cell in Direction C, and on
  the largest-but-one footprint. That is 57-RESEARCH F2.1's footprint-independence showing
  up in real art rather than on a fixture: a 64x96 hexagon costs less than a 32x32 octagon
  because it has two fewer corners, not because of its size. Nothing here was simplified on
  the belief that a bigger asset has less room.

  Colour literals are the named LOCKED_SKIN ramp values; see candidates/README.md.
-->
<svg viewBox="0 0 64 96" xmlns="http://www.w3.org/2000/svg">
  <path data-part="badge" d="M32 4 L60 26 V70 L32 92 L4 70 V26 Z" fill="#565f70" />
  <path data-part="outline" d="M32 4 L60 26 V70 L32 92 L4 70 V26 Z" fill="none" stroke="#2a2f3a" stroke-width="3" />
  <path data-part="switch" d="M28 44 H36 V52 H28 Z" fill="#1b1f27" />
  <path data-part="port-in" d="M0 48 H4" fill="none" stroke="#565f70" stroke-width="2" />
  <path data-part="port-out-a" d="M60 30 H64" fill="none" stroke="#565f70" stroke-width="2" />
  <path data-part="port-out-b" d="M60 66 H64" fill="none" stroke="#565f70" stroke-width="2" />
</svg>
