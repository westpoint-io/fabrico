<!--
  candidates/d/source.svg - DIRECTION D draft for the SOURCE machine (BOARD-01, plan 57-05).

  A DRAFT, NOT SHIPPED ART. Phase 57 locks a DIRECTION; Phase 58 authors the art. The
  never-ships boundary, the colour-source exemption and the ART-04 policy are stated once
  in candidates/README.md and are not repeated here.

  FOOTPRINT: 1x1 -> viewBox 0 0 32 32, the true base footprint, authored at its real size.

  DIRECTION D - "schematic / circuit" (57-CONTEXT.md D-02): LINE-ONLY, WITH TERMINAL PINS AT
  THE PORTS. Drawn as the direction it actually is rather than as a hedged version. D-02
  records a risk against it - that it reads as a diagram rather than as a factory - and the
  board exists to let that risk be SEEN. A softened D, one that quietly borrowed a plate or
  an icon to look more machine-like, would remove the very thing being judged and would make
  the lock a decision about a direction nobody drew.

  LINE-ONLY IS LITERAL HERE: THERE IS NOT ONE FILLED PATH ANYWHERE IN DIRECTION D. The
  tempting relaxation was a schematic junction dot (a small filled square), which is the
  conventional mark for "these crossing traces connect". It was rejected, for a measurement
  reason rather than a taste one: the plan asks whether an all-stroke direction is actually
  cheap, and letting fills in would have contaminated the answer with the one primitive that
  costs 2 vertices per point instead of 4. Ambiguity is avoided instead by construction - no
  two traces in this direction ever cross without meeting at a corner or a T.

  D REUSES DIRECTION A'S INK VALUES ON PURPOSE, as a control. #b0bacb at 3u for the frame and
  2u for detail is exactly A's system, so D vs A isolates CONSTRUCTION - routed traces and
  terminal pins - rather than paint. Had D also arrived with a new palette, D-02's recorded
  "reads as a diagram" risk would have been masked by a colour change instead of exposed.

  THE CONSEQUENCE OF THAT CONTROL, STATED PLAINLY BECAUSE IT IS A FINDING AND NOT AN
  OVERSIGHT: `frame` here is BYTE-IDENTICAL to a/source.svg's `chassis`. A schematic component
  outline is a thin rectangle, and so is a blueprint chassis; the two directions genuinely
  converge on the same 4-inset box. Everything separating D from A is therefore inside that
  box (right-angle traces and a symbol instead of an icon) plus the pins outside it. Whether
  that is enough separation at 1x is precisely the D-02 risk, and it is left visible.

  SEMANTIC VOCABULARY - CONSCIOUSLY REJECTED, and replaced in kind. synth/glyphs.ts:29 says of
  SOURCE "spawn eye with a filled pupil". An eye is an ICON, and Direction D has no icons: its
  language is the symbol set of a wiring diagram. The eye is therefore dropped and the
  electronics equivalent substituted - a square-wave generator symbol, tapped by a trace that
  leaves through the outflow pin. The reading is preserved (this thing originates a signal);
  the vocabulary is not. This rejection is the honest cost of D and is recorded per file.

  ART-04 PROVENANCE: authored from scratch for this board. No icon pack was consulted,
  copied, traced or redrawn - not Material Symbols (permitted as a VOCABULARY REFERENCE
  ONLY), and not game-icons.net or Remix Icon, which are excluded outright.

  MEASURED: 72 vertices / 36 points, band `ok`.

  Colour literals are the named LOCKED_SKIN ramp values; see candidates/README.md.
-->
<svg viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg">
  <path data-part="frame" d="M4 4 H28 V28 H4 Z" fill="none" stroke="#b0bacb" stroke-width="3" />
  <path data-part="wave" d="M10 20 V13 H16 V20 H22 V13" fill="none" stroke="#b0bacb" stroke-width="2" />
  <path data-part="trace-out" d="M22 16 H28" fill="none" stroke="#b0bacb" stroke-width="2" />
  <path data-part="pin-out" d="M30 13 V19" fill="none" stroke="#b0bacb" stroke-width="2" />
  <path data-part="port-out" d="M28 16 H32" fill="none" stroke="#565f70" stroke-width="2" />
</svg>
