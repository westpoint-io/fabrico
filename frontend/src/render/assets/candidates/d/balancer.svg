<!--
  candidates/d/balancer.svg - DIRECTION D draft for the BALANCER machine (BOARD-01, plan 57-05).

  A DRAFT, NOT SHIPPED ART. Phase 57 locks a DIRECTION; Phase 58 authors the art. The
  never-ships boundary, the colour-source exemption and the ART-04 policy are stated once
  in candidates/README.md and are not repeated here.

  FOOTPRINT: 2x2 -> viewBox 0 0 64 64, the true base footprint, authored at its real size.

  DIRECTION D - "schematic / circuit": line-only, terminal pins at the ports. The full
  statement of D's line-only rule, its A-ink control and the frame/chassis convergence is at
  d/source.svg.

  SEMANTIC VOCABULARY - CARRIED. synth/glyphs.ts:70-72 says of BALANCER: "two full-width
  horizontal bars joined by a central spine (an 'I')". Two rails and a bus is already circuit
  language, so it carries over intact and becomes, if anything, more literal: the two rails
  now run edge to edge from pin to pin, so each is visibly a CIRCUIT from an inlet to an
  outlet, and the bus between them is what makes the two circuits share.

  THE MERGE/BALANCER PAIR IN DIRECTION D - THE HONEST ANSWER, WHICH IS THE OPPOSITE OF
  DIRECTION C'S. These two are named as the pair most likely to collapse in greyscale. In C
  they cannot collapse, because the outlines are different shapes. In D they are BOTH a
  4-inset rectangle carrying a few 2u traces, which is the same construction A and B use, so
  D inherits the same exposure A and B have: the only thing separating this cell from
  d/merge.svg at 1x is the ROUTING of three or four thin lines inside identical frames. D's
  one mitigation is not shape but AXIS - this balancer's traces and pins are horizontal on
  both sides, while merge's are vertical top and bottom, so the pin positions alone put the
  two cells on different axes before any trace is read.

  THAT IS RECORDED AS A WEAKNESS OF DIRECTION D AND IS NOT DRAWN AWAY. The available fix -
  giving the balancer a distinguishing outline - is Direction C's proposition, and importing
  it here would make this cell a C/D hybrid and the board's fourth column a mixture rather
  than a direction. D-03 explicitly allows the review to land on a per-axis mix ("B's chassis with
  C's silhouettes"), and the way to keep that option honestly open is for each direction to
  be drawn purely so the axes can be separated afterwards.

  ART-04 PROVENANCE: authored from scratch for this board. No icon pack was consulted,
  copied, traced or redrawn - not Material Symbols (permitted as a VOCABULARY REFERENCE
  ONLY), and not game-icons.net or Remix Icon, which are excluded outright.

  MEASURED: 112 vertices / 56 points, band `ok`. FOUR ports means four held-constant stubs
  (32) plus four terminal pins (32) - 57% of this cell is port furniture, on a drawing whose
  entire interior is three straight traces (24). Direction D's cost scales with PORT COUNT,
  which no other direction's does.

  Colour literals are the named LOCKED_SKIN ramp values; see candidates/README.md.
-->
