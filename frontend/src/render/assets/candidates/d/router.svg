<!--
  candidates/d/router.svg - DIRECTION D draft for the ROUTER machine (BOARD-01, plan 57-05).

  A DRAFT, NOT SHIPPED ART. Phase 57 locks a DIRECTION; Phase 58 authors the art. The
  never-ships boundary, the colour-source exemption and the ART-04 policy are stated once
  in candidates/README.md and are not repeated here.

  FOOTPRINT: 2x3 -> viewBox 0 0 64 96, the only non-square footprint in the set and the true
  base footprint, authored at its real size.

  DIRECTION D - "schematic / circuit": line-only, terminal pins at the ports. The full
  statement of D's line-only rule, its A-ink control and the frame/chassis convergence is at
  d/source.svg.

  SEMANTIC VOCABULARY - CONSCIOUSLY REJECTED, and replaced by a stronger equivalent. This is
  the one subject where D's rejection is an upgrade rather than a cost, and saying so is part
  of measuring the direction honestly. synth/glyphs.ts:85-87 says of ROUTER: "a clean diamond
  OUTLINE ... with an inner dot on the equator - the 'decide which way' motif". The decision
  diamond is FLOWCHART vocabulary, and it depicts a decision without showing an outcome. The
  schematic equivalent is an SPDT SELECTOR: a pole, a blade, and two contacts, with the blade
  visibly THROWN toward one of them. That does something the diamond cannot - it shows the
  decision AND which way it went, which is what a router actually does to an item.

  THE ASYMMETRY IS THE POINT AND MUST NOT BE READ AS SLOPPINESS. `contact-a` is connected to
  the blade and `contact-b` is not; the short `contact-b-mark` bar is the unselected terminal
  the blade would swing to. A symmetric drawing would say "two outputs exist" where this one
  says "one output is selected". If the asymmetry instead reads as a broken or half-drawn
  cell at 1x, that IS the finding and it belongs on the board.

  ART-04 PROVENANCE: authored from scratch for this board. No icon pack was consulted,
  copied, traced or redrawn - not Material Symbols (permitted as a VOCABULARY REFERENCE
  ONLY), and not game-icons.net or Remix Icon, which are excluded outright.

  MEASURED: 120 vertices / 60 points, band `ok`, against a/router.svg's 80 and b/router.svg's
  88 - a 50% premium over A on this subject, the largest gap D opens anywhere. `blade` is the
  ONLY diagonal in Direction D; every other line in the direction is axis-aligned, which is
  the circuit-board idiom and is also exact at every zoom (VEC-03).

  Colour literals are the named LOCKED_SKIN ramp values; see candidates/README.md.
-->
