<!--
  render/assets/balancer.svg - SHIPPED art for the BALANCER machine (ART-01/ART-04, plan 58-02).

  Promoted from `candidates/a/balancer.svg`, the Direction A draft judged on the Phase
  57 art board and locked (`57-ART-LOCK.md`). This file sits FLAT in `render/assets/`, and
  that placement is a contract rather than a convenience: the discovery walk in
  `scripts/lint-svg.ts`, `vertexBudget.test.ts` and `geometryDigest.test.ts` is
  non-recursive, which is exactly what keeps `candidates/` and `__fixtures__/` out of the
  shipped table. A shipped asset in a subdirectory is an asset no gate measures.

  GLYPH ONLY - NO CHASSIS PATH, NO PORT STUBS (design decision, 2026-08-02). The CHASSIS is
  drawn in CODE (`render/layers/machineChassis.ts`) at whatever `w x h` the footprint
  actually is. The candidate's FOUR port stubs are not carried: ports are board-drawn from
  the authoritative `ports[]`, and a BALANCER is exactly the kind a user grows through the
  `+ Add output` gesture, so a frozen four-stub layout would be wrong the moment they did.

  FOOTPRINT: BALANCER's base footprint is 2x2, so `viewBox 0 0 64 64`.

  SEMANTIC VOCABULARY - CARRIED. `synth/glyphs.ts:70-72` reads the BALANCER as a parallel
  even split: two full-width horizontal bars joined by a central spine, an "H" on its side.
  PARALLEL is the load-bearing property - the instant the bars converge or diverge the
  machine reads as a MERGE or a TEE, and three kinds that share a footprint become one
  blurry family at 1x.

  THE FOUR 6u RETURNS ARE THE ONE DELIBERATE CHANGE FROM THE CANDIDATE, and they exist to
  make the design decision MEASURABLE rather than merely asserted. The ruling (2026-08-01) was
  that BALANCER and MERGE - identical under Direction A's shared outline - are separated by
  glyph MASS DISTRIBUTION: BALANCER carries mass at the FOUR CORNERS, symmetric about BOTH
  axes; MERGE carries mass at the TOP, funnelling, symmetric about ONE. The candidate's
  bare bars (`M 14 20 H 50` / `M 14 44 H 50`) already satisfy "an H on its side, symmetric
  about both axes", but they put essentially no ink at the corners: 96u of glyph ink, almost
  all of it on the two axes. Turning each rail end inward moves 24u of 120u - 20% - into the
  four corner regions, which is what "mass at four corners" has to MEAN if a gate is going
  to be able to fail on it. Cost: +16 tessellated vertices against a 400 ceiling this
  subject uses under a fifth of.

  DO NOT "SIMPLIFY" THE RETURNS BACK TO BARE BARS. That edit is invisible to every
  conformance and cost gate in the tree and it silently deletes the discriminator ART-03's
  colour-vision gate is built to test. Symmetry, stated so it is checkable: mirror about
  x = 32 and about y = 32 both map this glyph onto itself.

  FILL COUNT 0.

  ART-04 PROVENANCE: authored from scratch for the Phase 57 board. No icon pack was
  consulted, copied, traced or redrawn - not Material Symbols (permitted as a VOCABULARY
  REFERENCE ONLY), and not game-icons.net (CC-BY-3.0, which redrawing does not clear) or
  Remix Icon (non-OSI), which are excluded outright. Promotion carries that provenance
  forward unchanged; the corner returns are an in-direction edit by the same author, not a
  new source.

  COLOUR SOURCE - THE SHIPPED RULE, NOT THE CANDIDATE'S EXEMPTION. Every draft in
  `candidates/` is exempt from the "no hand-authored hex" rule BECAUSE IT NEVER SHIPS.
  This file ships, so that basis evaporates and is deliberately not restated. The standing
  rule stands: the one literal below is `LOCKED_SKIN.palette.ramp[4]` (0xb0bacb, the
  highlight step), the single ink lock axis 9 permits for every kind's glyph, and it is
  held to that value by the fail-severity ink allowlist over the SHIPPED assets in
  `assets/shippedAssets.test.ts` - by a gate, not by this paragraph.

  Geometry: integer coordinates only, every coordinate EVEN, commands limited to M H V L Z,
  zero curves, one `<path>` per semantic part carrying its own stable `data-part`, one
  element per line. The authoring contract is render/assets/README.md.
-->
<svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
  <path data-part="rail-top" d="M 14 26 V 20 H 50 V 26" fill="none" stroke="#b0bacb" stroke-width="2" />
  <path data-part="rail-bottom" d="M 14 38 V 44 H 50 V 38" fill="none" stroke="#b0bacb" stroke-width="2" />
  <path data-part="spine" d="M 32 20 V 44" fill="none" stroke="#b0bacb" stroke-width="2" />
</svg>
