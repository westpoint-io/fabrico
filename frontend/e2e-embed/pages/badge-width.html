<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Badge widths</title>
<style>
  html, body { margin: 0; background: #1b1f27; color: #b0bacb; }
  body { font-family: 'Martian Mono', monospace; font-size: 12px; line-height: 1.4; }
  main { width: 1024px; margin: 0 auto; padding: 48px 24px; }
  section { margin: 0 0 48px; }
  h2 { font-family: 'Sono', monospace; font-size: 18px; line-height: 1.2; font-weight: 700; letter-spacing: 0.5px; text-transform: uppercase; margin: 0 0 24px; }
</style>
</head>
<body>
<main>
  <!-- docs/script-outcomes fed in reverse order. layout.spec.ts opens a copy of this page with the
       board's pin moved, so the badge shows the widest text a board can show: "final state
       xxxxxxxx order-dependent". 328 px is a docs column on a 360 px phone with 16 px gutters,
       and 340 px one on a 375 px phone, rounded down. -->
  <section>
    <h2>328 px</h2>
    <div data-badge-width="328" style="width: 328px"><fabrico-board name="docs-script-outcomes" order="reversed"></fabrico-board></div>
  </section>
  <section>
    <h2>340 px</h2>
    <div data-badge-width="340" style="width: 340px"><fabrico-board name="docs-script-outcomes" order="reversed"></fabrico-board></div>
  </section>
  <section>
    <h2>360 px</h2>
    <div data-badge-width="360" style="width: 360px"><fabrico-board name="docs-script-outcomes" order="reversed"></fabrico-board></div>
  </section>
</main>
<!-- fabrico:bundle -->
</body>
</html>
