<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Board widths</title>
<style>
  html, body { margin: 0; background: #1b1f27; color: #b0bacb; }
  body { font-family: 'Martian Mono', monospace; font-size: 12px; line-height: 1.4; }
  main { width: 1024px; margin: 0 auto; padding: 48px 24px; }
  section { margin: 0 0 48px; }
  h2 { font-family: 'Sono', monospace; font-size: 18px; line-height: 1.2; font-weight: 700; letter-spacing: 0.5px; text-transform: uppercase; margin: 0 0 24px; }
</style>
</head>
<body>
<main>
  <section>
    <h2>360 px</h2>
    <div data-width="360" style="width: 360px"><fabrico-board name="demo_scene"></fabrico-board></div>
  </section>
  <section>
    <h2>600 px</h2>
    <div data-width="600" style="width: 600px"><fabrico-board name="demo_scene"></fabrico-board></div>
  </section>
  <section>
    <h2>1024 px</h2>
    <div data-width="1024" style="width: 1024px"><fabrico-board name="demo_scene"></fabrico-board></div>
  </section>
</main>
<!-- fabrico:bundle -->
</body>
</html>
