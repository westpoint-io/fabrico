# Fabrico CI — the permanent, blocking DETERMINISM GATE.
#
# This closes the carried Phase-1 obligation: the four determinism lints are
# CLIPPY-load-bearing, not compiler-enforced. A plain `cargo build` / `cargo test`
# does NOT catch a float or an unordered HashMap in fabrico-core — only
# `cargo clippy … -D warnings` does, with the bans in clippy.toml. So CI MUST run
# clippy or a determinism-killer can merge silently.
#
# The job re-proves the full certification suite (criteria 1-5) on all three Tauri
# target platforms at the CI proptest case count, plus two cross-platform guards.
# All three platforms run on push to master/main and on workflow_dispatch; pull
# requests run the Linux leg only. See the comment above the determinism job's
# `strategy:` block.
#
# The `push:` trigger names `master` and keeps `main`, so a future default-branch
# rename does not silently stop every push run. The presence of a job here is not
# evidence that it is green: check the run history on the GitHub remote.
#
# REQUIRED CHECK: mark the `determinism` job a REQUIRED status check in branch
# protection for `master`. Branch protection is a repository setting and cannot
# be expressed in this YAML.
# Before doing so, read the `concurrency:` comment below and the comment
# above the determinism job's `strategy:` block (which legs run on which event).

name: ci

on:
  pull_request:
  push:
    branches: [master, main]
  # Manual full run: every job and every determinism leg runs.
  workflow_dispatch:

# LEAST PRIVILEGE, workflow-wide. With no `permissions:` block
# every job inherits the repository's DEFAULT GITHUB_TOKEN scope, which on a repo
# created before GitHub's 2023 default change is read/write on contents, packages,
# issues and more. Not one job here needs a write scope: they build, lint, test and
# screenshot. They also run `npm ci` and `cargo build`, which execute third-party
# code - and that code inherits whatever the token can do. Declaring the floor once
# here applies it to every job, including any job added later.
#
# A job that genuinely needs more must raise it in its OWN `permissions:` block, which
# is a visible, reviewable diff rather than a silent inheritance.
#
# STILL OPEN, recorded rather than quietly fixed: actions/checkout@v4,
# actions/setup-node@v4 and Swatinem/rust-cache@v2 are pinned to MUTABLE major tags. A
# tag repoint is a supply-chain rewrite of a workflow intended to become a required
# status check. Pinning to commit SHAs with a version comment is the remedy; it needs
# the SHAs resolved against the network, so it is not done yet.
permissions:
  contents: read

# CANCEL SUPERSEDED PULL REQUEST RUNS, NEVER A MASTER RUN.
#
# Pull request runs for the same PR share `github.ref` (`refs/pull/N/merge`), so a new
# push to a PR cancels that PR's in-progress run. Every other run (push, which is only
# configured for master/main, and workflow_dispatch) gets a group of its own keyed on
# `github.run_id`, so it is never in a group with any other run.
#
# WHY THE run_id FALLBACK AND NOT A SHARED GROUP. With a shared group, GitHub keeps at
# most one PENDING run per group even when cancel-in-progress is false: a newer run
# replaces a pending one. Under a burst of master pushes that would drop the verdict for
# a master commit. A group unique per non-PR run takes master out of the mechanism
# entirely; the cancel rule is ALSO gated on pull_request as a second guard.
# `ci_wiring_parity.rs` asserts both lines exactly.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # TIME LIMITS. GitHub's default is 360 minutes a job, and one wedged run can spend a large
  # share of a month's Actions minutes (a wedged macOS leg ten times that). Each
  # `timeout-minutes` is about one and a half to two times the slowest measured duration of
  # that job. The live suite also has its own `globalTimeout` (playwright.live.config.ts),
  # under its job's limit, so an overrun writes a report before the runner is killed.
  # ===================================================================================
  # GOLDEN-CORPUS AUTHORING DRIFT (added 2026-08-19, milestone v8.0 Phase 63 plan 63-13).
  #
  # THIS JOB IS THE DELIBERATE CLOSURE OF PHASE 63's RESEARCH FINDING 2: until it, the
  # golden corpus had NO authoring-drift guard AT ALL, and the two things that look
  # like one are each asserting something else.
  #
  #   - `crates/fabrico-core/tests/cert_cross_platform.rs` pulls each fixture in with
  #     `include_bytes!` and REPLAYS it. It never re-authors and it never reads
  #     `EditRecord.schema_version`.
  #   - `Core::run_log_two_logs` does not read the edit schema version either.
  #
  # Name the difference plainly, because it is the whole premise of the keystone phase:
  #   REPLAY-EQUALITY    - the committed bytes still fold to the committed per-tick
  #                        hashes. This is what everything above asserts.
  #   AUTHORING-EQUALITY - the committed bytes still equal what today's generators
  #                        produce. NOTHING asserted this before plan 63-01 built
  #                        `scripts/measure-golden-corpus.sh`, and nothing RAN it on
  #                        every commit before this job.
  #
  # The consequence of that gap, stated because it actually happened rather than as a
  # hypothetical: `port_catalog` lives in the UNFROZEN `fabrico-command` crate and its
  # output is written verbatim into `EditOp::Place.ports`, which is postcard-encoded
  # into the corpus. Widening the Router's port arity therefore moved five golden
  # fixtures - and the corpus would have kept REPLAYING green at the old bytes forever
  # while nothing in the repository ever told anyone. That class of change is invisible
  # to every check a reviewer would think to run and is visible ONLY to something that
  # re-authors and compares.
  #
  # THIS DOES NOT REVERSE THE T-3-BLESS DECISION. The script regenerates the corpus in
  # place and compares it with a copy of the committed bytes. In CI the checkout is thrown
  # away after the job, so nothing is blessed. Blessing remains an explicit, reviewed act
  # performed through `scripts/regen-golden.sh`, exactly as
  # `crates/fabrico-core/tests/regen.rs` requires by keeping every generator `#[ignore]`d.
  #
  # A RED HERE IS NOT AUTOMATICALLY A BUG. It means a generator input moved and the
  # corpus was not re-blessed. Under the v8.0 standing constraint that is a HARD STOP
  # from Phase 64 onward, because no phase after the keystone may re-bless.
  #
  # No apt step: the script's only cargo invocation is
  # `cargo test -p fabrico-core --locked --test regen -- --ignored`, and
  # `cargo tree -p fabrico-core` pulls no gtk-sys, no webkit2gtk-sys and no tauri, so
  # the GTK/WebKit prerequisites the `determinism` job installs are not preconditions
  # here. Checkout depth is left at the default: this job resolves no ref.
  golden-corpus:
    name: golden corpus reproduces from its own generators
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pinned toolchain
        run: rustup show

      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2

      - name: Golden-corpus authoring-drift measurement
        env:
          CORPUS_LABEL: ci
        run: bash scripts/measure-golden-corpus.sh

  # ===================================================================================
  # NO TRACKED FILE CARRIES PRIVATE RESIDUE.
  #
  # WHY. This repository was published from a private one, and the maintainer's planning
  # notes stay in a separate checkout inside the working tree, ignored by this repository.
  # A comment that cites those notes by path, names the maintainer, or names the tooling
  # and machine behind them is a broken pointer for every other reader, and some of it is
  # personal data. `scripts/check-no-private-residue.sh` scans every tracked text file for
  # those patterns (the full list is in its header) and names each offending line.
  private-residue:
    name: no tracked file carries private residue
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Private-residue gate
        run: bash scripts/check-no-private-residue.sh

  determinism:
    name: determinism gate
    # WHICH LEGS RUN ON WHICH EVENT (a spend control). A leg is one (os, leg) pair of the
    # matrix below.
    #   pull_request: one leg, (ubuntu-24.04, main).
    #   push to master/main, workflow_dispatch and any other event: four legs,
    #   (ubuntu-24.04, main), (macos-latest, main), (windows-latest, main) and
    #   (windows-latest, all-features).
    # The Linux label is pinned because `ubuntu-latest` moves between Ubuntu releases and
    # the apt package names in the step below were checked for 24.04 only. macOS is billed
    # at 10x Linux and Windows at 2x, so the macOS leg dominates the cost of a full run. An
    # unexpected event resolves to every operating system (the fail-safe direction).
    #
    # WHY WINDOWS ALONE SPLITS. Every operating system runs both certification suites
    # (shipped-default and all-features) exactly once. On Linux and macOS both run on the
    # one `main` leg, one after the other, and the second runs even when the first went red. On Windows they took 16.3 plus 13.6 minutes in
    # one measured run and 23.6 plus 20.0 in another, back to back, which made Windows the
    # longest leg of the workflow. So Windows runs the shipped-default suite and every
    # other gate on its `main` leg, and the all-features suite alone on its `all-features`
    # leg, in parallel. The step conditions below say which step runs on which leg. The
    # `exclude:` entries drop the all-features leg on Ubuntu and macOS. GitHub ignores an
    # exclude entry that matches no leg, so a pull request (Ubuntu only) still gets one.
    # Splitting costs no coverage: both suites keep PROPTEST_CASES=1024, and no proptest
    # fixes a seed, so each run still draws its own 1024 cases per property.
    #
    # CHECK NAMES CARRY THE LEG: `determinism gate (ubuntu-24.04, main)`,
    # `determinism gate (windows-latest, all-features)` and so on.
    #
    # THE TRADE: a platform-only break is found after merge, on the master run, not on
    # the PR.
    #
    # REQUIRED CHECKS. If branch protection is enabled, never require the macOS or Windows
    # legs: a required check must not wait on a leg that never runs on a PR.
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(github.event_name == 'pull_request' && '["ubuntu-24.04"]' || '["ubuntu-24.04","macos-latest","windows-latest"]') }}
        leg: [main, all-features]
        exclude:
          - os: ubuntu-24.04
            leg: all-features
          - os: macos-latest
            leg: all-features
    runs-on: ${{ matrix.os }}
    timeout-minutes: ${{ matrix.os == 'windows-latest' && 90 || 30 }}
    # Use bash for EVERY run step across the matrix so the windows-latest runner
    # executes the .sh gate scripts via Git Bash, identically to Linux/macOS
    # (RESEARCH Pitfall 3). Paired with `.gitattributes *.sh eol=lf` so the
    # scripts are checked out with LF line endings on Windows.
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # LINUX-ONLY system deps for the Tauri shell (added 2026-08-17).
      #
      # WHY THIS STEP EXISTS. Every cargo invocation in this job below that is not
      # scoped with `-p` covers every workspace member, and one of them -
      # `fabrico-app` - is the Tauri 2 shell. `cargo tree -p fabrico-app -e normal`
      # lists webkit2gtk-sys 2.0.2, javascriptcore-rs-sys 1.1.1, soup3-sys 0.5.0 and
      # gtk-sys 0.18.2 as NORMAL (not optional, not dev) dependencies. Those crates
      # resolve their linkage through `system-deps`/`pkg-config` at build-script time,
      # so they need the .pc files that only the GTK/WebKit *-dev packages install.
      # A stock GitHub `ubuntu-latest` image does not ship them. Without this step the
      # Linux leg cannot compile the workspace at all, so `Clippy` and the certification
      # suite would both die in the build-script phase rather than on the predicate they exist to test.
      #
      # WHY IT IS GATED ON `runner.os`, NOT ON `matrix.os`. The matrix is expressed as
      # `os: [ubuntu-latest, macos-latest, windows-latest]` feeding `runs-on:
      # ${{ matrix.os }}`. macOS links WKWebView and Windows links WebView2, both
      # OS-provided, so an ungated apt step would hard-fail two thirds of the matrix.
      # `runner.os == 'Linux'` is preferred over `matrix.os == 'ubuntu-latest'` because
      # it survives a pin of the label to a dated image (`ubuntu-24.04`), which the
      # string compare would silently turn into a skip - a skip that reopens exactly
      # this hole. Note the job-wide `defaults.run.shell: bash` still applies here; the
      # step is simply never selected off Linux.
      #
      # AMENDED 2026-09-30: the matrix is no longer that literal list;
      # it is the event-dependent list in the `strategy:` block above (Linux only on
      # pull_request, all three otherwise). The reasoning for gating on `runner.os` is
      # unchanged and still holds.
      #
      # PACKAGE LIST PROVENANCE. The first nine entries are Tauri 2's documented
      # Debian/Ubuntu prerequisite set for the webkit2gtk-4.1 line
      # (https://v2.tauri.app/start/prerequisites), copied rather than guessed.
      #
      # `libdbus-1-dev` IS NOT IN THAT DOCUMENTED SET and is added here on measured
      # evidence, not on faith. fabrico-app -> tauri 2.11.3 -> tauri-runtime-wry ->
      # tao 0.35.3 -> dbus 0.9.11 -> libdbus-sys 0.2.7, and libdbus-sys's build script
      # `panic!`s outright when `dbus-1.pc` is absent. It is plausible the runner image
      # already carries it, but "plausible" is the posture this repo has been bitten by
      # six times; naming the package costs one already-satisfied apt entry and removes
      # the guess.
      #
      # WHAT IS ACTUALLY LOAD-BEARING, measured rather than assumed (2026-08-17). The
      # pkg-config search path was redirected to a directory holding ONLY the .pc
      # closure of `webkit2gtk-4.1` + `dbus-1` + the gtk3 X11/Wayland set - i.e. exactly
      # what `libwebkit2gtk-4.1-dev` (which Depends on libgtk-3-dev, libsoup-3.0-dev and
      # libjavascriptcoregtk-4.1-dev) plus `libdbus-1-dev` install - and
      # `cargo clippy --all-targets --all-features -- -D warnings` then compiled all six
      # members, fabrico-app included, and exited 0. `xdo.pc` was ABSENT from that
      # directory throughout, which is the direct evidence that `libxdo-dev` is not
      # needed by this dependency graph today. `libayatana-appindicator3-dev` and
      # `librsvg2-dev` likewise have no crate in `cargo tree -p fabrico-app` (no
      # tray-icon, no rsvg, and the bundler does not run in CI), and `libssl-dev` is
      # unused because reqwest is pinned to rustls. All four are KEPT: they are
      # the documented set, they are cheap or already installed on the runner image, and
      # adding a tray or a bundle step later must not silently re-break the Linux leg.
      #
      # NOT VERIFIED, stated plainly: this apt step has NOT been executed. It cannot be
      # run on a machine without apt, and no run of this
      # workflow has been observed on GitHub. The local evidence above simulates the
      # package set through pkg-config; it does not prove these package NAMES resolve on
      # ubuntu-24.04. That part rests on the Tauri documentation and on Ubuntu's own
      # naming for libdbus-1-dev. Two directions of the check were exercised, so the
      # simulation is not vacuous: with the search path EMPTY the same clippy line dies
      # in libdbus-sys's build script, and it kept dying, one -sys crate at a time,
      # until the closure above was complete.
      - name: Install Tauri Linux system deps (GTK/WebKit/dbus .pc files)
        if: runner.os == 'Linux'
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libdbus-1-dev

      # Honor the pinned toolchain (rust-toolchain.toml: channel 1.98.0 +
      # clippy component). rustup on the runners reads that file and installs the
      # EXACT pinned compiler — the certified compiler is the single source of
      # truth, never a floating version re-specified here (T-3-DRIFT).
      # Fallback: if the clippy component is somehow not auto-added, uncomment:
      #   rustup component add clippy
      - name: Install pinned toolchain
        run: |
          rustup show
          rustup component add clippy || true

      # Both Windows legs share this job's one cache entry: the key is the job id, the
      # runner's OS and architecture and a hash of the toolchain and lockfiles, and the leg is
      # not part of it. Both restore it, and only the `main` leg saves it, so the two never
      # race to write one entry. The all-features leg builds the same test binaries (see the
      # certification comment below), so the cache `main` saves is warm for it too.
      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ matrix.leg != 'all-features' }}

      # Build gate (Phase-04) — fail FAST on the first C-toolchain runtime dep.
      # `rquickjs` vendors quickjs-ng and `cc`-compiles it (gcc on ubuntu, clang on
      # macos, MSVC on windows-latest). The first MSVC build of vendored quickjs-ng is
      # the MEDIUM-confidence risk this phase de-risks (RESEARCH A5 / Pitfall 6); a
      # dedicated build step surfaces a Windows C-build break IMMEDIATELY here, instead
      # of deep inside the long PROPTEST_CASES=1024 certification run below. The runners
      # already provide the required toolchain (gcc/clang/MSVC) and Git's bundled `patch`,
      # and Swatinem/rust-cache covers the steady-state cost — only a toolchain or
      # quickjs-ng version bump re-triggers the full C compile. NO bindgen/libclang setup
      # is needed (the dep uses pre-generated bindings).
      #
      # `--all-features` added 2026-08-17 alongside the certification-suite fix below,
      # for one reason: this step is a FAIL-FAST PREVIEW of the target set the later
      # steps compile, and a preview that builds a smaller set than the thing it
      # previews is not one. fabrico-core's `test-support` feature gates
      # real code (the hostile-snapshot forge the host's tests use); without the flag a
      # break inside it surfaces minutes later, deep in the certification run, which is
      # the failure mode this step was written to avoid. `-p fabrico-core` is KEPT on
      # purpose - the point is to hit the vendored C compile early, not to widen scope.
      #
      # `main` leg only: on Windows the all-features leg runs its certification suite and
      # nothing else, and that suite compiles the same C code before its first test.
      - name: Build (vendored quickjs-ng C toolchain gate)
        if: matrix.leg == 'main'
        run: cargo build -p fabrico-core --all-targets --all-features

      - name: Clippy (determinism lints, -D warnings)
        if: matrix.leg == 'main'
        run: cargo clippy --all-targets --all-features -- -D warnings

      # Gate 3/4 — pointer-width serialized-field forward guard (cross-platform
      # postcard width-trap, T-3-WIDTH).
      - name: Pointer-width serialized-field guard
        if: matrix.leg == 'main'
        run: bash scripts/check-no-usize-state.sh

      # Gate 4/4 — the full certification suite (criteria 1-5 + existing suites)
      # at the CI proptest case count.
      #
      # `--all-features --no-fail-fast` added 2026-08-17. This line read
      # `cargo test --workspace` and carried BOTH of the blind spots this milestone
      # has already been bitten by - a gate whose exit status is decided by something
      # other than the predicate it tests.
      #
      # WHY `--all-features`. A whole-file `#![cfg(feature = ...)]` test target still
      # compiles and still LINKS with its feature off - into an EMPTY test binary - and
      # the harness prints "running 0 tests" followed by "test result: ok". cargo counts
      # that target as green. MEASURED locally on this tree when the flag was added
      # (2026-08-17), both runs at PROPTEST_CASES=32, `--locked --no-fail-fast` held
      # constant:
      #     without --all-features : 75 targets, 929 passed, 0 failed
      #     with    --all-features : 75 targets, 936 passed, 0 failed
      # Same target count, seven more assertions actually executed - five in the
      # development pace board's feature-gated spec plus two `test-support`-gated tests
      # in fabrico-core. That is exactly how Phase 62 shipped a red test past a gate
      # reporting FULLY GREEN, and the local red-set check of the time already ran
      # `cargo test --workspace --locked --all-features --no-fail-fast` for the same
      # reason - CI was the odd one out.
      #
      # WHAT THE TREE DECLARES TODAY, re-read when the Windows suites were split into two
      # legs. The development pace switch and both of the features that motivated the
      # paragraph above are gone. The workspace declares three features: `redb` and
      # `test-support` in fabrico-core, and `dev-seams` in fabrico-host. `redb` and
      # `dev-seams` are on by default. `test-support` is off by default, but fabrico-core
      # and fabrico-host both list fabrico-core with it as a dev-dependency, and
      # `cargo test --workspace` builds dev-dependencies, so Cargo's feature unification
      # turns it on in the default run too. The two runs below therefore build the same
      # test binaries with the same features on, which is why running them on two parallel
      # legs costs no coverage. The flag still earns its place: the day a feature is
      # declared that no default and no dev-dependency turns on, only the all-features run
      # compiles what it gates.
      #
      # **KEEP THE FLAG. The prose is what was stale, not the flag.** A silently stale
      # justification is how the next reader concludes a flag is decorative and drops it,
      # which would take this phase's own verification baseline with it. Measured at
      # 68-07: the two runs below now report the IDENTICAL count (1197 passed / 0 failed
      # / 34 ignored, 85 result lines each), because the nine tests that used to differ
      # between them were the pace switch's own and went with it.
      #
      # WHAT `--all-features` CHANGES ABOUT WHAT THIS JOB PROVES, stated rather than
      # glossed: it certifies the union of every workspace feature rather than the
      # shipped default set alone. Today that union and the default test build are the
      # same (see above), and `test-support`, the one feature that reaches the default run
      # only through a dev-dependency, is a TEST surface rather than a shipped
      # capability - so the gap this paragraph used to warn about (a run proving a build
      # the shipped app must never be) no longer exists. The default build is still
      # covered on its own by the SHIPPED-default step below, by the `Build` step above
      # and by the clippy gate.
      #
      # WHY `--no-fail-fast`. Without it cargo stops at the first test binary that
      # exits non-zero, so a red run names one crate and leaves the other 70-plus
      # targets unmeasured - the fix-one-see-the-next-one loop, one CI round trip per
      # failure, on a job that takes minutes. With it every target runs and one run
      # reports the whole red set. It cannot mask a failure: cargo's exit status is
      # still non-zero if ANY target failed.
      #
      # NOT ADDED, deliberately: `--locked`. It would be a real improvement (it makes
      # a drifted Cargo.lock a hard error instead of a silent update), but it is a
      # different assertion from the two above and it can turn this job red on a lock
      # that is merely stale rather than wrong. Recorded as a follow-up, not smuggled
      # into this fix.
      # TWO RUNS, NOT ONE, AND THE FIRST ONE IS THE SHIPPED BUILD.
      #
      # `--all-features` alone was WRONG and was caught by an adversarial review before
      # it ever ran. Turning the development pace feature on workspace-wide compiled OUT
      # every `#[cfg(not(feature = ...))]` guard that depended on it - and two of those
      # guards were the compile-time exhaustive `match` over the control-message enum
      # that PROVED the shipped app carried no runtime pace verb, one in `sim_loop.rs`
      # and one in `fabrico-app/src/lib.rs`. So a single `--all-features` run deleted the
      # only CI coverage of the default-feature build, which is the build users actually
      # get. Measured, not reasoned: a defect planted in the shipped command surface
      # reddened the default-feature run and stayed GREEN under `--all-features`.
      #
      # That was the same shape as the defect `--all-features` was added to fix (a
      # feature-gated target compiling to an empty binary and printing
      # "running 0 tests ... ok"), just pointed the other way.
      #
      # BOTH RUNS ARE KEPT AFTER 68-07, AND THE REASON IS NOW A DIFFERENT ONE - stated
      # rather than left as an inherited habit. Since the removal there are no
      # `#[cfg(not(feature = ...))]` guards left that `--all-features` could compile out,
      # so the specific trap above is closed and the two runs report identical counts
      # today. They are kept because the ONLY thing keeping them identical is that every
      # declared feature is on by default or turned on by a dev-dependency; the moment a feature
      # gates real behaviour again, the default-feature run is the one that measures what
      # ships, and re-adding a step under pressure is how coverage gets lost. Two cheap
      # runs are the price of not having to notice.
      #
      # WHICH LEG RUNS WHICH SUITE. On Linux and macOS the job has one leg, `main`, and it
      # runs both steps below, the shipped-default one first. On Windows the `main` leg runs
      # the shipped-default step and the `all-features` leg runs the all-features step, in
      # parallel (WHY WINDOWS ALONE SPLITS, at the top of this job, has the measured
      # minutes). The all-features condition starts with `!cancelled()`, so on Linux and macOS
      # it runs even after the shipped-default suite went red: without it, the implicit
      # `success()` skipped it, and an all-features-only break stayed hidden until the
      # shipped red was fixed. The job is red either way.
      # `crates/fabrico-host/tests/ci_wiring_parity.rs` pins both run lines, their
      # PROPTEST_CASES, these two conditions and the matrix that makes the legs.
      - name: Certification suite - SHIPPED default features (PROPTEST_CASES=1024)
        if: matrix.leg == 'main'
        env:
          PROPTEST_CASES: 1024
        run: cargo test --workspace --no-fail-fast

      - name: Certification suite - all features (PROPTEST_CASES=1024)
        if: ${{ !cancelled() && (matrix.leg == 'all-features' || runner.os != 'Windows') }}
        env:
          PROPTEST_CASES: 1024
        run: cargo test --workspace --all-features --no-fail-fast

      # cargo hides a passing test's output, and the first-fault depth has to reach this log on
      # every operating system, because the recursion test holds only coarse bounds on it. The
      # `main` leg is the one each operating system runs, so it runs there; on the Windows
      # all-features leg it would print the same depth a second time.
      - name: First-fault recursion depth on this runner
        if: ${{ always() && matrix.leg == 'main' }}
        run: cargo test -p fabrico-core --test factory_memory_pin shallow_recursion -- --nocapture

      # Disk and memory after the certification suite, on Linux only and whatever the
      # earlier steps did (added 2026-10-12, plan 84-01). The 2026-10-09 CI run died on the
      # ubuntu leg with `ld terminated with signal 7 [Bus error]` while linking test
      # binaries, the signature of a full disk; this step makes a second exhaustion
      # readable from the log instead of inferred.
      - name: Disk and memory after the certification suite (Linux; The 2026-10-09 run died with ld Bus error)
        if: ${{ always() && runner.os == 'Linux' }}
        run: df -h / && free -m

  # ===================================================================================
  # THE HEADLESS BUILD: the engine and the core with `redb` off.
  #
  # WHY IT IS ITS OWN JOB. Every other cargo line in this file turns `redb` on: `--all-features`
  # does it directly, and a `--workspace` run does it through feature unification, because
  # fabrico-host takes the core's default features. tests/deps_headless.rs only reads
  # `cargo tree` and compiles nothing. So `use fabrico_core::persist::RedbStore` in the engine,
  # or a dropped `#[cfg(feature = "redb")]` in persist.rs, left all of them green with the
  # headless build broken (review 93 WR-05). A `-p` run with no `--workspace` and no
  # `--all-features` resolves features for that package alone.
  #
  # Clippy runs on the same two configurations, because a dead import under the off
  # configuration is only a warning to `cargo check`.
  #
  # No apt step: neither package reaches the Tauri shell. The vendored QuickJS needs the C
  # compiler the runner image already has. Linux only: the determinism job compiles each
  # platform, and which features are on does not depend on the platform.
  headless-build:
    name: the engine and the core build with redb off
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pinned toolchain
        run: |
          rustup show
          rustup component add clippy || true

      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2

      - name: Check the engine on its own feature set
        run: cargo check -p fabrico-engine --locked

      - name: Check the core with its default features off
        run: cargo check -p fabrico-core --no-default-features --locked

      - name: Clippy on the engine, redb off
        run: cargo clippy -p fabrico-engine --locked -- -D warnings

      - name: Clippy on the core, redb off
        run: cargo clippy -p fabrico-core --no-default-features --locked -- -D warnings

  # ===================================================================================
  # THE WEBASSEMBLY PLAYER: the engine built for the browser, and the checks on that build.
  #
  # WHY IT IS ITS OWN JOB. No other job compiles for wasm. A change that breaks the wasm build, makes
  # the player's packets or hashes differ from a native run, or grows the module past its size budget
  # would leave every other job green. `ci_wiring_parity.rs` matches each check's run line whole, so
  # dropping a step fails that test.
  #
  # THE COMPILER. `rustup target add` runs after `rustup show`, so the wasm standard library lands on
  # the toolchain rust-toolchain.toml pins. apt installs clang and llvm because QuickJS's C code needs
  # a clang with a wasm32 backend, plus llvm-ar. The runner's gcc can't emit wasm.
  #
  # WASM_OPT IS ON THE BUILD STEP, not in the job's `env`. The `runner` context isn't available at job
  # level, and GitHub refuses the whole workflow file over it. Only scripts/build-wasm.sh reads it.
  #
  # THE WASM CLIPPY STEP. The workspace clippy line compiles for the host only, so it never reads code
  # under a wasm32 `cfg` or a build script's wasm32 branch. This step lints the player and the corpus
  # harness for wasm32. It compiles the vendored QuickJS outside scripts/build-wasm.sh, which is why CC and AR for wasm32 are
  # in the job's `env`.
  #
  # THE BROWSER, WITHOUT APT. The Playwright step installs Chromium with no `--with-deps`. The
  # ubuntu-24.04 image already has every library Chromium links, so `--with-deps` only added nine
  # font packages and four Mesa upgrades, 32.1 MB from the Ubuntu mirror. The player checks draw no
  # canvas and read no text, so they use none of it. Runs 44405254645 and 44405292666 were cancelled
  # at the old 6-minute limit with that fetch still going: their mirror (us-east-2.ec2) sent it at
  # about 60 kB/s, where the azure mirror on run 44294890291 took 2 s. The same fetch took 200 to
  # 682 s in about a third of the Chromium jobs on those runs. Playwright checks the libraries when
  # it launches Chromium and names any that are missing, so an image that drops one fails by name.
  #
  # TIME LIMIT. A run adds up to about 265 seconds, so the limit is 1.81 times that, 8 minutes.
  # Measured on a developer machine: the cold scripts/build-wasm.sh on one core 67 seconds, with the
  # corpus harness and its native tool in it, the cold wasm32 clippy on one core 34 (an upper bound,
  # since that run also compiled the standard library), and scripts/install-wasm-opt.sh 6. Recorded
  # on GitHub, the slowest of runs 44294890291, 44405254645 and 44405292666, 158 more: job setup and
  # checkout 8, toolchain 11, Node 7, the clang apt step 46 on the slow mirror, the cargo cache 11 to
  # restore and 9 to save, npm ci 6, the Playwright browser 19, the artifact upload 3, the six checks
  # 29, and the fence report and its prover 8 (the prover and a toolchain pin check have since been
  # removed).
  wasm-player:
    name: the wasm player builds on the pinned compiler and passes its checks
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    env:
      FABRICO_WASM_OUT: ${{ github.workspace }}/target/wasm-out
      CC_wasm32_unknown_unknown: clang
      AR_wasm32_unknown_unknown: llvm-ar
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pinned toolchain
        run: |
          rustup show
          rustup component add clippy || true
          rustup target add wasm32-unknown-unknown

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install clang and llvm-ar for the wasm C build
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang llvm

      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2

      - name: Install frontend deps
        working-directory: frontend
        run: npm ci

      - name: Install Playwright chromium
        working-directory: frontend
        run: npx playwright install chromium

      - name: Install the pinned wasm-opt
        run: bash scripts/install-wasm-opt.sh "${{ runner.temp }}/binaryen"

      - name: Build the player
        env:
          WASM_OPT: ${{ runner.temp }}/binaryen/wasm-opt
        run: bash scripts/build-wasm.sh

      - name: Keep the player module for the embed job
        uses: actions/upload-artifact@v4
        with:
          name: fabrico-player-wasm
          path: target/wasm-out
          retention-days: 1
          if-no-files-found: error

      - name: Compare the player with the native build under Node
        run: bash scripts/check-wasm-player.sh

      - name: Run the demo board in headless Chromium
        run: bash scripts/check-player-browser.sh

      - name: Check the player against its size budget
        run: bash scripts/check-player-size.sh

      - name: Replay the corpus in wasm and compare it with native
        run: bash scripts/check-wasm-corpus.sh

      - name: Check where a Factory runs out of gas, memory and stack on both targets
        run: bash scripts/check-fence-report.sh

      - name: Clippy on the player and the corpus harness, for wasm32
        run: cargo clippy -p fabrico-player -p fabrico-wasm-corpus --target wasm32-unknown-unknown --locked -- -D warnings

  # THE READ-ONLY BOARD EMBED, in a job of its own after wasm-player. It takes the module that job
  # built as an artifact, so the pages carry the module CI built and checked, and this job needs no
  # Rust toolchain. scripts/build-embed.sh inlines the module into the bundle and the test pages,
  # and scripts/check-embed.sh opens each page by file:// URL in headless Chromium and fails unless
  # every listed test passed. When wasm-player fails, this job still
  # starts under the gate and fails at the download, so a broken player can't leave it skipped.
  # The artifact upload drops file modes, so a step that runs a native tool from the artifact has
  # to set the executable bit itself. scripts/check-embed.sh runs the native dump_packets tool from
  # the artifact as its per-tick oracle, and sets that bit before it does.
  #
  # THE OFFLINE FILE. build-embed.sh also writes frontend/dist-examples/fabrico-examples.html, the
  # one file that runs every example board from disk, and scripts/check-offline-browsers.sh opens
  # it in three browsers: Chromium and Firefox through Playwright (Firefox with its stock file://
  # policy, proven by a canary first), and WebKitGTK through python gi. Both legs run under Xvfb,
  # because headless Firefox makes no WebGL context without an X display. The WebKitGTK
  # leg runs on the runner's own /usr/bin/python3, because the gi bindings come from the apt
  # packages, so this job has no setup-python step. libgl1-mesa-dri is listed so Mesa's software
  # GL, which WebGL needs under Xvfb, doesn't depend on what the other packages pull in.
  #
  # TIME LIMIT. The offline check runs one test a board in each of the three browsers, so this job
  # grows with the board count. The first GitHub run took 5 min 55 s in all (embed build 17 s, embed
  # check 163 s, offline check 130 s). Run 43670312713 with 34 boards was cancelled at the old
  # 10-minute limit: setup 52 s, embed build 60 s, embed check 3 min 47 s, then the offline check
  # spent 4 min 2 s on Chromium (7.1 s a board) and was cut 3 boards into Firefox. Locally at 34
  # boards Chromium took 3.2 s a board, Firefox 4.7 s and WebKitGTK about 3.1 s. Firefox runs about
  # 1.2 times slower on GitHub and Chromium 2.2 times, so the offline check comes to about 12 min
  # there (about 20 s a board) and the job to about 17.5 min, or 20.3 min if Firefox runs 2 and
  # WebKitGTK 3 times slower. That set a 35-minute limit. Run 44294890291 on 5404975 was cancelled
  # at 35 minutes by the Ubuntu mirror, not by a test: the Playwright install took 14 min 5 s, of
  # which 13 min 6 s was apt fetching Firefox's 59.8 MB of dependencies at 76 kB/s, so the job
  # reached the offline check after 23 min 12 s. The offline check took 12 min 1 s on the green run
  # 43974435804, so a run that slow on both comes to 35 min 13 s end to end. The limit is 1.7
  # times that, 59.9 minutes, rounded up to 60. Caching the browsers wouldn't help: their download
  # took 10 s of the 14 minutes. Each new board adds about 20 s, so measure again after about 15
  # more boards.
  embed:
    name: the read-only board embed runs from disk in a browser
    needs: wasm-player
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      FABRICO_WASM_OUT: ${{ github.workspace }}/target/wasm-out
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend deps
        working-directory: frontend
        run: npm ci

      - name: Install Playwright chromium and firefox
        working-directory: frontend
        run: npx playwright install --with-deps chromium firefox

      - name: Install WebKitGTK and Xvfb
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends xvfb python3-gi python3-gi-cairo gir1.2-webkit2-4.1 libgl1-mesa-dri

      - name: Take the player module wasm-player built
        uses: actions/download-artifact@v4
        with:
          name: fabrico-player-wasm
          path: target/wasm-out

      - name: Build the embed bundle and its test pages
        run: bash scripts/build-embed.sh

      - name: Run the embed pages from disk in headless Chromium
        run: bash scripts/check-embed.sh

      - name: Open the offline examples file in Chromium, strict Firefox and WebKitGTK
        run: bash scripts/check-offline-browsers.sh

      # The test antialiasing switch must not reach the docs embed. The bundle built above is
      # a separate Vite build (library mode), so it gets its own absence check.
      - name: The embed bundle carries no test antialiasing switch
        run: bash scripts/check-test-aa-switch-absent.sh frontend/dist-embed

  # THE DOCS SITE, in a job of its own. It regenerates the facts the pages quote and fails when the
  # committed site/src/generated/facts.json differs from what the code says now, runs the prose lint,
  # the fact-literal lint and the site's unit tests, builds the site with scripts/build-site.sh, and
  # runs the docs suite with scripts/check-docs.sh (every page loads with no console error, every
  # board runs to its end tick with a matching hash and a healthy render, every internal link
  # resolves, axe finds no violation, every page the coverage manifest lists was built, and the
  # built site leaks no source map or private path).
  #
  # IT BUILDS THE PLAYER ITSELF. build-site.sh builds the wasm player and the embed bundle from this
  # commit before the site, so the boards on the pages come from the same commit as the pages, and
  # the job doesn't wait on wasm-player. That is why it carries the same toolchain, clang and llvm, and wasm-opt steps as
  # wasm-player, and why it calls build-wasm.sh and build-embed.sh only through build-site.sh.
  #
  # THE README'S HERO. build-site.sh also captures the README's animated hero from the demo board
  # in this commit's embed bundle (frontend/scripts/capture-hero.ts), checks it, and puts it in
  # site/dist/hero/. The capture encodes with img2webp, from Ubuntu's webp package, which the apt
  # step installs beside clang and llvm; the runner has no ImageMagick. The last step keeps the
  # three hero files as the fabrico-hero artifact on every run that isn't cancelled, a failed
  # suite included, so a reviewer can download the hero CI made from a run on any ref. The hero
  # is never committed. The capture adds about 20 s to the site build here; measure the job's time
  # again after its first run on GitHub with the hero in.
  #
  # NODE 24. astro 7.4.4 refuses Node 22 below 22.23.4, and the site's package.json asks for 24.
  #
  # TIME LIMIT. The first GitHub run of this job took 5 min 51 s on a cold cargo cache (the facts
  # step compiled fabrico-host for 74 s and the site build took 2 min 10 s). With the reference,
  # troubleshooting and contributing pages and their 29 boards, run 43275257033 on fdc0196 took
  # 9 min 18 s: the site build 2 min 19 s and the docs suite 5 min 29 s (359 tests). The limit is
  # 1.7 times that run, 15.8 minutes, rounded up to 16. Phases 98 and 99 grew the suite to 562
  # tests and 60 boards, and posters now render 4 at a time. Run 43965812382 on af97ffd was cut at
  # 16 min with the site build at 3 min 50 s and the docs suite still running after 11 min 11 s, so
  # the job needs at least about 17 min. The limit was 1.7 times that, 29 minutes, rounded up to 30.
  # With the hero capture and the Pages upload in, run 44405254645 took 1448 s (24.1 minutes) on a
  # slow Ubuntu mirror, 80% of that limit. The limit is 1.7 times that run, 41.0 minutes, rounded up
  # to 42 (review 101 WR-06). Measure again when the suite grows a lot.
  docs:
    name: the docs site builds and passes its checks
    runs-on: ubuntu-24.04
    timeout-minutes: 42
    env:
      FABRICO_WASM_OUT: ${{ github.workspace }}/target/wasm-out
      CC_wasm32_unknown_unknown: clang
      AR_wasm32_unknown_unknown: llvm-ar
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pinned toolchain
        run: |
          rustup show
          rustup target add wasm32-unknown-unknown

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            site/package-lock.json

      - name: Install clang and llvm-ar for the wasm C build, and img2webp for the hero
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang llvm webp

      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2

      - name: Install frontend deps
        working-directory: frontend
        run: npm ci

      - name: Install the site's deps, running no package's install script
        working-directory: site
        run: npm ci --ignore-scripts

      - name: Install Playwright chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Install the pinned wasm-opt
        run: bash scripts/install-wasm-opt.sh "${{ runner.temp }}/binaryen"

      - name: Regenerate the facts the pages quote
        working-directory: site
        run: npm run facts

      - name: Fail when the committed facts differ from the code
        run: git diff --exit-code -- site/src/generated/facts.json

      - name: Prose lint over the site's pages
        working-directory: site
        run: npm run lint:prose

      - name: Fact-literal lint over the site's pages
        working-directory: site
        run: npm run lint:facts

      - name: The site's unit tests
        working-directory: site
        run: npm run test:unit

      - name: Build the player, the embed bundle and the site
        env:
          WASM_OPT: ${{ runner.temp }}/binaryen/wasm-opt
        run: bash scripts/build-site.sh

      - name: Run the docs suite over the built site
        run: bash scripts/check-docs.sh

      - name: Keep the hero this run made
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: fabrico-hero
          path: site/dist/hero/
          if-no-files-found: error
          retention-days: 14

      # Only a push to main hands the site on to the pages job, and only once the docs suite above
      # has passed on this same folder: a failed step stops the job before this one.
      - name: Upload the checked site for Pages
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        uses: actions/upload-pages-artifact@v5
        with:
          path: site/dist

  # THE DOCS SITE ON GITHUB PAGES, at https://westpoint-io.github.io/fabrico/. This job deploys the
  # site/dist folder the docs job just built and checked, which that job uploads as the Pages
  # artifact on a push to main only. Pull requests, other branches and workflow_dispatch never
  # deploy.
  #
  # WHY deploy-pages AND NOT A BRANCH. actions/deploy-pages publishes the uploaded artifact with a
  # short-lived OIDC token (the id-token scope) and the pages scope, so no job here holds a
  # token that can push to the repository, and Pages runs no Jekyll pass that would drop Astro's
  # `_astro` folder. This job runs one first-party action and no package code, so it is the only job
  # that holds either scope; `ci_wiring_parity.rs` refuses them anywhere else.
  #
  # BEFORE THE FIRST DEPLOY, Pages must be switched on for the repository with GitHub Actions as its
  # source (Settings, Pages, Source). With Pages off this job fails and the site isn't published.
  #
  # CONCURRENCY. Deploys queue in the `pages` group and a deploy in progress is never cancelled, so a
  # newer push waits for the older deploy to finish instead of cutting it off half way.
  #
  # TIME LIMIT. 10 minutes is a starting figure with no measurement behind it yet; measure the first
  # deploys and set it to 1.5 to 2 times the slowest.
  pages:
    name: the checked docs site deploys to GitHub Pages
    needs: docs
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - name: Deploy the site the docs suite checked
        id: deployment
        uses: actions/deploy-pages@v5

  # THE LIVE DOCS SITE, checked after each deploy. scripts/check-pages-smoke.sh runs the Pages smoke
  # (frontend/e2e-smoke/) against the live address. It first polls build.json, which the site build
  # writes with the commit it came from, with a query no cache has seen, until it names this run's
  # commit; Pages serves the previous deployment for a while after a deploy, so the smoke never
  # checks yesterday's site. Then it opens one page per docs section and runs its boards to their
  # manifest hashes with a healthy render, checks both sitemaps list every page, fetches the hero
  # and checks its sidecar names this commit's demo board, and fetches every absolute README link.
  # It builds nothing and runs neither the site build nor the docs suite.
  #
  # A LATER PUSH'S DEPLOY. This job isn't in the `pages` group, and putting it there wouldn't help:
  # the next push's deploy is already waiting in that group and starts the moment this push's
  # deploy ends. So the next deploy can go live while this smoke runs. When the smoke fails and
  # build.json names a later commit that has this run's commit as an ancestor, the script exits 0
  # with a notice instead, because that commit's own smoke checks the live site (review 101 WR-01).
  #
  # TIME LIMIT. The build.json poll gives up after 15 minutes, the boards on six pages take a few
  # minutes more, and the Playwright install with its apt dependencies took 14 min 5 s on the slow
  # mirror day of run 44294890291 (Chromium only is less). 30 minutes covers all three; measure the
  # first runs and set it from them.
  pages-smoke:
    name: the live docs site serves this commit's pages, boards, sitemap and hero
    needs: pages
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend deps
        working-directory: frontend
        run: npm ci

      - name: Install Playwright chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Smoke-test the live docs site
        env:
          FABRICO_DOCS_URL: https://westpoint-io.github.io/fabrico/
          FABRICO_SMOKE_SHA: ${{ github.sha }}
        run: bash scripts/check-pages-smoke.sh

      - name: Keep the smoke's test results when it fails
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: pages-smoke-results
          path: frontend/test-results/smoke/
          retention-days: 14

  # Frontend e2e gate (Phase 13-04, TEST-04) — the "one schema, two producers"
  # proof. Playwright drives the REAL Vite app and asserts the emitted GridCommand
  # bytes (Place/Wire/Delete) on the dev render WebSocket, plus an axe a11y audit
  # over the React chrome. The frontend is NOT a cargo member, so the determinism
  # job's `cargo test --workspace` does not cover it — this job does.
  #
  # ubuntu-only on purpose: chromium download + headless run is flaky across the
  # Windows/macOS matrix (RESEARCH Pitfall 4), and the cross-platform guarantees
  # live in the determinism job. One Linux chromium run is the right cost/coverage.
  #
  # FOUR SHARDS ON FOUR RUNNERS. On one runner the suite's 606 tests took 18 to 35 minutes
  # on 2 workers. It now runs as `--shard=<i>/4`, one leg per runner, and each leg boots its
  # own Vite through the config's webServer. The check names become
  # `frontend e2e (Playwright + axe) (1)` to `(4)`.
  #
  # THE VERDICT IS THE EXIT CODE. A failed test fails the run step and the leg.
  # `fail-fast: false` keeps the other legs running after one goes red, and any red or
  # cancelled leg turns the run red. `forbidOnly` stays on in playwright.config.ts, so a stray
  # `test.only` fails CI.
  #
  # NO RETRY. `playwright.config.ts` sets `retries: 0`, so a test that fails once fails its
  # leg instead of passing as flaky, and `trace: 'retain-on-failure'` keeps the trace of
  # that one attempt. A red leg uploads its traces as `mock-test-results-<i>`.
  #
  # The limit is per leg: the slowest single-runner run was 35 minutes, a quarter of it
  # doubled is under 20, and setup comes on top.
  e2e:
    name: frontend e2e (Playwright + axe)
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend deps
        working-directory: frontend
        run: npm ci

      # Download the chromium browser binary (+ its OS deps) Playwright drives.
      - name: Install Playwright chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      # Boots `npm run dev` via playwright.config.ts webServer, then runs this leg's
      # quarter of the command-emission + a11y specs.
      - name: Run e2e (Playwright + axe)
        working-directory: frontend
        run: npm run test:e2e -- --shard=${{ matrix.shard }}/4

      # The leg's JSON report holds each test's duration (for shard balancing). It is uploaded
      # red or green, and a leg with no report fails here.
      - name: Keep this shard's mock report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: mock-report-${{ matrix.shard }}
          path: frontend/test-results/mock-report.json
          if-no-files-found: error
          retention-days: 14

      # A failing leg's traces go nowhere otherwise, and a red that only CI shows needs them.
      - name: Keep the traces of a red mock shard
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: mock-test-results-${{ matrix.shard }}
          path: frontend/test-results/
          retention-days: 14

  # Live E2E gate (Phase 22, E2E-01..04): Playwright drives headless chromium
  # against the REAL dev_render_server binary (real Core -> RenderProducer ->
  # postcard -> WS) plus the real Vite app, ZERO mocks. This is the milestone
  # gate that closes the v2.0 injected-packet trap: the final step runs the
  # byte-identical `npm run e2e:live` command developers run locally (never a
  # variant invocation).
  #
  # ubuntu-only on purpose, for the same reason as the `e2e` job above: one
  # Linux chromium run is the right cost/coverage, and the cross-platform
  # guarantees live in the determinism job.
  #
  # EVIDENCE, same posture as the other jobs (see the file header): this job had
  # not been observed executing on GitHub when this paragraph was written. What was
  # proven is that `npm run e2e:live` runs green locally on each commit that touches
  # it. AMENDED 2026-10-12 (plan 84-02): the 2026-10-09 CI run executed it on
  # GitHub: 180 tests, 1 worker, 46.8 min, 156 passed, 9 failed, 15 did not run.
  #
  # THE VERDICT IS THE EXIT CODE. Each leg runs the developer command, and a red test fails the
  # leg. No test in the live suite fails on purpose: a clause that can't be walked is cut from
  # the walk and its reason recorded in a comment. Playwright's `forbidOnly` and `retries: 0`
  # stay on in frontend/playwright.live.config.ts. Each leg uploads its JSON report
  # (`frontend/test-results/live-report.json`) as `live-report-<i>` unless the run was
  # cancelled, for per-test timings.
  #
  # FOUR SHARDS ON FOUR RUNNERS. With one worker against one host, this job took 96 to 128
  # minutes. The suite now runs as `--shard=<i>/4`, one leg per runner, each leg with its own
  # dev host, so each leg runs about a quarter of the tests. Playwright cuts shards at file
  # boundaries, so a serial file stays whole in one shard. Playwright also adds the terminal
  # spec (`90-sim-fatal.terminal.spec.ts`, the teardown that ends the host) back into every
  # shard, so every leg ends its own host last, and its 4 tests run 4 times.
  #
  # REQUIRED CHECK: if branch protection is turned on for `main`, make each leg of this job a
  # REQUIRED status check, alongside `determinism`. Branch protection is a repository setting
  # and cannot be expressed in this YAML.
  e2e-live:
    name: live e2e gate (real headless host)
    # One leg per shard. A red leg must not cancel the others, so each shard reports its own
    # tests and keeps its own report.
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    runs-on: ubuntu-24.04
    # The limit is per leg. The slowest shard took 14.75 min locally (shard 3/4, 2026-11-07); CI
    # runs a test up to 2.9 times slower, and twice that rounds up to the 90 min `globalTimeout`
    # in frontend/playwright.live.config.ts. Plus 15 min of build before the suite is 105, so a
    # shard that overruns writes its report before the runner is killed.
    timeout-minutes: 105
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Honor the pinned toolchain (rust-toolchain.toml); no clippy needed here.
      - name: Install pinned toolchain
        run: rustup show

      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2

      # Build the host binary BEFORE any Playwright step so the webServer
      # timeout never covers compilation (mirrors the npm script's pre-build).
      #
      # NO GTK/WebKit apt step here, and that is CHECKED rather than assumed
      # (2026-08-17): this build is `-p fabrico-host`, and `cargo tree -p fabrico-host
      # -e normal` contains no gtk-sys, no webkit2gtk-sys, no soup3-sys, no
      # javascriptcore-rs-sys and no tauri at all - fabrico-app is the only member that
      # pulls them, and nothing in this job or the `e2e`/`unit` jobs compiles it. The
      # sibling `e2e` job compiles no Rust whatsoever (its Playwright webServer is
      # `npm run dev`, i.e. Vite), and `unit`'s `npm run check:board` shells out to
      # `npm run build`, also Vite-only. So the apt step belongs to `determinism`
      # alone.
      #
      # NO `--all-features` here, deliberately. When this was written it was the one
      # place where adding the flag would have been a DEFECT rather than a fix:
      # fabrico-host carried a development-only feature that added a runtime pace control
      # verb and a one-way save-refusal latch, and turning it on would have handed the
      # live gate a different binary from the one `npm run e2e:live` builds locally and
      # from the one that ships. Plan 68-07 removed that feature (BELT-05 / D-68-12), so
      # fabrico-host now declares NO features at all and the flag would be a no-op rather
      # than a defect. It stays off anyway: the gate's whole value is that it runs the
      # byte-identical developer command, and a flag the developer command does not carry
      # is a divergence waiting for a feature to be added behind it.
      - name: Build dev_render_server
        run: cargo build -p fabrico-host --example dev_render_server

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend deps
        working-directory: frontend
        run: npm ci

      - name: Install Playwright chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      # The developer command with this leg's shard (the inner cargo build is a warm-cache
      # no-op). Its exit code is the leg's verdict: any red test fails the job here.
      - name: Run this live shard
        working-directory: frontend
        run: npm run e2e:live -- --shard=${{ matrix.shard }}/4

      # The docs tour's pictures (site/src/assets/tour/), taken again from the real app once per
      # run, on shard 1 only. The script starts its own host and Vite now that the suite has freed
      # 8787 and 5173, and fails when a picture comes out blank, the wrong size, or with a page
      # error or a stopped render loop. It doesn't compare them with the committed pictures. It
      # runs even when this shard's suite went red, since the two checks don't depend on each
      # other.
      - name: Retake the app tour pictures and check their size and blankness
        if: ${{ !cancelled() && matrix.shard == 1 }}
        working-directory: frontend
        run: npm run capture:tour

      # The new pictures, so a reviewer can look at what CI took.
      - name: Keep the retaken tour pictures
        if: ${{ !cancelled() && matrix.shard == 1 }}
        uses: actions/upload-artifact@v4
        with:
          name: tour-pictures
          path: site/src/assets/tour/
          retention-days: 14

      # The per-test JSON report (timings for shard balancing), kept for a red shard too. A leg
      # with no report fails here.
      - name: Keep this shard's live report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: live-report-${{ matrix.shard }}
          path: frontend/test-results/live-report.json
          if-no-files-found: error
          retention-days: 14

      # A failing run's traces go nowhere otherwise, and a red that only CI shows needs them.
      - name: Keep the traces of a red live shard
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: live-test-results-${{ matrix.shard }}
          path: frontend/test-results/
          retention-days: 14

  # THE LESSON WALK, in a job of its own. The live job has hundreds of tests and a lesson test
  # there would only add to its time. The walk's files are named *.walk.ts, which neither live config
  # matches, so they stay out of the live suite's test count too.
  #
  # THREE LEGS. One worker against one host made the walk take 19 to 43 minutes, so it runs as three
  # legs, one shard each, on separate runners. The shard comes from FABRICO_WALK_SHARD on the walk
  # step, which frontend/playwright.walk.config.ts reads, so the run line stays the developer's whole
  # `npm run e2e:walk`. The config keeps `fullyParallel: false`, so Playwright splits by whole file:
  # the walk's tests share one mutable host, and a file's tests run in order on it. That puts
  # lesson-variants.walk.ts alone in leg 2, and the other two legs hold two files each.
  #
  # ITS VERDICT IS ITS EXIT CODE. The walk declares no red, so a failed test fails its leg at
  # the run step, and any red leg turns the run red.
  #
  # THE LIMIT. The walk has 32 tests: 12 in the first leg (lesson-entry 6, lesson-hints 6), 12 in
  # the second (lesson-variants) and 8 in the third (lessons 5, parity 3). CI run 43670312713 on
  # 09b448e ran the three legs in 14.0, 29.2 and 16.0 job minutes (Playwright's own 12.8, 28.1 and
  # 14.8). The slowest, the second leg, doubled is 58.4, rounded up to the next five minutes the way
  # 26.2 became 55 in run 42083745921, which gives the 60 minute `globalTimeout` in the walk config,
  # so an overrun writes a report before the runner is killed. This job's limit is those 60 plus 15
  # for the build. That recorded run replaces the local estimate (about 26.8 CI minutes for the
  # second leg at a ratio of 4.1). The third leg now reads lesson 5's reply comet at 33 pinned
  # render-clock steps, which added about 23 s per run on the local GPU proxy.
  e2e-walk:
    name: lesson walk (real headless host)
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pinned toolchain
        run: rustup show

      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2

      # Before any Playwright step, so the webServer timeout never covers compilation. The parity
      # test reads saved boards with replay_hash, so it is built here too.
      - name: Build dev_render_server and replay_hash
        run: cargo build -p fabrico-host --example dev_render_server --example replay_hash

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend deps
        working-directory: frontend
        run: npm ci

      - name: Install Playwright chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Run the lesson walk
        working-directory: frontend
        env:
          FABRICO_WALK_SHARD: ${{ matrix.shard }}/3
        run: npm run e2e:walk

      # A failing run's traces go nowhere otherwise, and a red that only CI shows needs them.
      - name: Keep the traces of a red walk shard
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: walk-test-results-${{ matrix.shard }}
          path: frontend/test-results/
          retention-days: 14

  # THE BOARD CAPTURE SET. `npm run e2e:capture` boots the real host and the Vite app with the demo
  # board, captures the board at each pixel ratio, antialiasing setting and zoom it lists, measures
  # each machine's outline sides from the pixels, and grades the measurements in a second project
  # that reads only what the first one wrote. No capture is compared with a stored image.
  #
  # WHY ITS OWN JOB. The live suite's job already runs close to its limit, so the capture set gets a
  # runner and a time limit of its own.
  #
  # THE LIMIT. The slowest recorded run is CI run 45022991094 on 1df4880, on a runner 1.6 to 1.9
  # times slower than run 44867588480's (18.5 job minutes). Its capture test for ratio 2 with
  # antialiasing on hit its own per-test limit and the job ended at 29.8 minutes; the part that
  # never ran, timed on the same runner, comes to about 2.6 more, so 32.4 job minutes in all (the
  # arithmetic is in the capture config). Doubled that is 64.8, rounded up to the next five
  # minutes the way the walk's 58.4 became 60, which gives the 65 minute `globalTimeout` in the
  # capture config, so an overrun writes a report before the runner is killed. This job's limit is
  # those 65 plus 15 for the build. They replace 40 and 55 from run 44867588480, which that slower runner showed were too
  # close: 40 minutes was 1.2 times its run.
  #
  # ITS VERDICT IS THE EXIT CODE. A failed capture or grading test fails the suite step and the
  # job. The page step and the uploads run on `!cancelled()`, so a red suite still gets its page
  # written.
  #
  # THE PAGE. `node scripts/capture-report.ts` writes test-results/capture/index.html, each capture
  # beside its measured numbers and verdicts, and the job uploads that folder as `board-captures` on
  # every run that isn't cancelled. A red run also uploads test-results/ with its traces.
  e2e-capture:
    name: board capture set (real headless host)
    runs-on: ubuntu-24.04
    timeout-minutes: 80
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pinned toolchain
        run: rustup show

      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2

      # Before any Playwright step, so the webServer timeout never covers compilation.
      - name: Build dev_render_server
        run: cargo build -p fabrico-host --example dev_render_server

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend deps
        working-directory: frontend
        run: npm ci

      - name: Install Playwright chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Run the board capture set
        working-directory: frontend
        run: npm run e2e:capture

      - name: Write the capture page
        if: ${{ !cancelled() }}
        working-directory: frontend
        run: node scripts/capture-report.ts

      - name: Keep the captures and their page
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: board-captures
          path: frontend/test-results/capture/
          if-no-files-found: error
          retention-days: 14

      # A failing run's traces go nowhere otherwise, and a red that only CI shows needs them.
      - name: Keep the traces of a red capture run
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: capture-test-results
          path: frontend/test-results/
          retention-days: 14

  # Frontend unit gate (Phase 56, plan 56-02, decision D-26) - the frontend's own
  # vitest suite and its typecheck, neither of which any CI job ran until now.
  #
  # The coverage gap this closes, stated as the parallel of the `e2e` job's own
  # reasoning: the frontend is NOT a cargo member, so the determinism job's
  # `cargo test --workspace` does not reach it - and the two Playwright jobs only
  # drive the built app end-to-end. Nothing invoked `vitest` or `tsc`. Until this
  # job, CI covered ZERO of the frontend's ~1,060 unit tests, so every vitest-based
  # gate in the tree was a local-only convention rather than a blocking check.
  #
  # WHAT THE `tsc --noEmit` STEP DOES AND DOES NOT COVER, stated precisely because an
  # overstated gate comment is exactly the artifact this phase exists to repair.
  #
  # UNTIL 2026-08-31 this paragraph read: `frontend/tsconfig.json` includes only
  # `src`, `shared`, `vite.config.ts` and `vitest.config.ts`, does NOT include `e2e/`,
  # `e2e-live/` or the Playwright configs, and so typechecks ZERO e2e specs. That was
  # accurate and it was a hole - the same one milestone v6.2 recorded as "tsc covers 0
  # of 43 e2e specs". Playwright strips types with babel at run time and never
  # typechecks, so nothing anywhere in the tree checked those 60 files - 58 specs and
  # their support modules, 25,389 lines, counted 2026-08-31.
  #
  # The include now carries `e2e`, `e2e-live`, all four Playwright configs and a
  # `typings` directory of ambient declarations. Adding them surfaced 37 real errors
  # across 7 specs, fixed in the same commit rather than excluded; one of them was a
  # `RailReport` interface in `belt-rail-continuity.spec.ts` that had drifted from the
  # fixture publishing its payload. So this step now typechecks the app, its unit
  # specs, BOTH e2e suites and the Playwright configs.
  #
  # It still does not RUN an e2e spec: a spec that typechecks and asserts the wrong
  # thing is caught by the `e2e` / `e2e-live` jobs, never here.
  #
  # This is also what makes VEC-02's literal wording ("A CI lint rejects
  # violations") true once plan 56-04's SVG lint lands: the lint is a vitest spec
  # under `src/`, so the `vitest run` step executes it here. There is deliberately NO
  # separate `npm run lint:svg` step - that spec calls the same walker, so a second
  # CI invocation would assert the same thing twice; `lint:svg` stays a local
  # authoring convenience.
  #
  # ubuntu-only, and no browser install: nothing here needs a GPU, a display or a
  # chromium binary. The job is ~1 minute.
  #
  # EVIDENCE, stated exactly (see the file header for the workflow-wide picture).
  # No run of this job has been OBSERVED. The trigger that would have carried it
  # named a branch that does not exist until phase 56's review fix, and CI has not
  # been observed running on a v6.2 commit either (v6.2 audit section 8). The
  # presence of this job is therefore NOT evidence that it is green. What IS
  # evidence: both commands below were run byte-identically, locally, on the commit
  # that added this job and both exited 0 (73 test files / 1064 tests passed; tsc
  # clean).
  #
  # RE-MEASURED 2026-08-17, because a stale evidence figure is the same overstated
  # gate comment this file exists to avoid: `npx vitest run` now reports 101 test
  # files / 1750 passed / 1 skipped, and `npx tsc --noEmit` is still clean. The
  # figures above are left in place as the record of what was measured WHEN THE JOB
  # WAS ADDED rather than overwritten, so the two readings can be compared.
  #
  # The five run-steps below were ALL replayed locally on 2026-08-17 and all exited 0
  # AFTER the `check:board` repair that day; before it, the last step exited 1 on two
  # separate assertions and had done since 2026-08-02, which is why this job would
  # have gone red on its first ever run.
  #
  # REQUIRED CHECK: mark `unit` a REQUIRED status check in branch protection for
  # `master` (alongside `determinism` and the `e2e-live` legs). Branch protection is a
  # repository setting and cannot be expressed in this YAML.
  unit:
    name: frontend unit (vitest + tsc)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend deps
        working-directory: frontend
        run: npm ci

      - name: Unit tests (vitest)
        working-directory: frontend
        run: npx vitest run

      - name: Typecheck (tsc --noEmit)
        working-directory: frontend
        run: npx tsc --noEmit

      # The art board's structural gate (phase 57 review WR-01). Until this step nothing in
      # CI invoked it; `check:board` existed as an npm script no job called.
      # Runs `npm run build` internally (check 1 asserts the board is structurally
      # absent from dist/), which is why it sits after the typecheck rather than before:
      # a type error is a faster and clearer failure than a bundle grep over a tree that
      # did not compile.
      - name: Art board structural gate
        working-directory: frontend
        run: npm run check:board

      # The test antialiasing switch boots the board with antialiasing on in the Vite dev
      # server only. `npm run check:board` above ran `npm run build`, so frontend/dist is the
      # app bundle the desktop binary embeds, and this checks the switch's flag name isn't in
      # it. The embed job runs the same check over frontend/dist-embed.
      - name: The app bundle carries no test antialiasing switch
        run: bash scripts/check-test-aa-switch-absent.sh frontend/dist

