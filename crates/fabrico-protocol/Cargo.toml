[package]
name = "fabrico-protocol"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish = false

# The sim->render wire contract: integer-only serde DTOs (RenderPacket family) plus
# the render->sim gesture command (GridCommand). This crate ONLY defines the shapes;
# the bounds-safe decode lives in fabrico-host (07-06) and the hand-rolled TS
# decoder (07-05). No floats / no `fixed` types here — positions/ticks/fill are
# integers on the wire, the renderer converts to floating-point canvas-side.

[dependencies]
serde    = { version = "1", features = ["derive"] }
ts-rs    = "12"
postcard = { version = "1", features = ["use-std"] }

[dev-dependencies]
# Pretty-JSON sibling for the 0007 cross-language golden fixture (the TS-readable
# expected object). Dev-only — never on the wire.
serde_json = "1"
