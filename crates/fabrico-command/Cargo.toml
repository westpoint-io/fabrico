[package]
name = "fabrico-command"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish = false

# The headless semantic COMMAND LAYER (CMD-01/CMD-03). It validates + normalizes a
# `GridCommand` into a RESOLVED `EditRecord` and drives a grid entirely from Rust —
# no renderer, no host, no mouse/pixels/screen-space. The SC#1 link constraint: this
# crate depends ONLY on the headless `fabrico-core` + the wire-contract
# `fabrico-protocol` + `serde`. NO tokio/axum/reqwest/lettre/tauri/pixi/wgpu — the
# `deps_are_headless` dependency-fence test (tests/deps_headless.rs) fails the build
# if any renderer/IO/host dependency leaks into the normal tree (CMD-03/SC#1).

[dependencies]
fabrico-core     = { path = "../fabrico-core", default-features = false }
fabrico-protocol = { path = "../fabrico-protocol" }
serde            = { version = "1", features = ["derive"] }

[dev-dependencies]
# Property tests for the Phase-12 undo/redo waves (mirrors fabrico-core/Cargo.toml:30,
# an existing first-party workspace dependency — NOT a new external package).
proptest         = "1"
# The on-disk edit-log format (the SAME postcard encoding `ProjectFile` v5 bundles).
# Dev-only: it rides the test tree alone, so the `deps_are_headless` normal-tree fence
# is untouched (postcard is serde-based — no renderer/IO/host surface).
postcard         = { version = "1.1", features = ["use-std"] }
# The human/TS-readable sibling format for the `route` cross-language golden
# (route_golden.rs). Already in the workspace lockfile (fabrico-protocol uses it);
# dev-only, serde-based — no renderer/IO/host surface, so the headless fence holds.
serde_json       = "1"
