[package]
name = "fabrico-qjs-alloc"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish = false

# The Factory runtime's memory-limited allocator. It decides when a Factory runs out of memory,
# so it has to behave the same on every platform. It is a separate crate because writing an
# allocator needs `unsafe` and `fabrico-core` forbids it.

[dependencies]
rquickjs = "0.14"
